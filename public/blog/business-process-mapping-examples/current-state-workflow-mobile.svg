<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1640" viewBox="0 0 720 1640" role="img" aria-labelledby="title desc">
  <title id="title">Current service workflow for mobile screens</title>
  <desc id="desc">A vertical workflow: requests arrive through several channels, a coordinator retypes them into a spreadsheet and chases missing details, an owner approves large quotes in chat, a dispatcher assigns work from the sheet and memory, a crew sends completion evidence in chat, and the coordinator manually updates the sheet and report.</desc>
  <defs>
    <marker id="arrow" markerWidth="18" markerHeight="18" refX="17" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 17 9 1 17Z" fill="#183153"/>
    </marker>
    <style>
      .eyebrow{font:700 20px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px;fill:#a4472a}
      .heading{font:700 34px Inter,Arial,sans-serif;fill:#152436}
      .deck{font:400 22px Inter,Arial,sans-serif;fill:#516071}
      .lane{font:700 18px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.6px;fill:#152436}
      .step{font:700 25px Inter,Arial,sans-serif;fill:#152436}
      .detail{font:400 21px Inter,Arial,sans-serif;fill:#526273}
      .tag{font:700 17px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#9e3f25}
      .calloutHead{font:700 24px Inter,Arial,sans-serif;fill:#fff}
      .calloutText{font:400 20px Inter,Arial,sans-serif;fill:#dce7f2}
    </style>
  </defs>

  <rect width="720" height="1640" fill="#f7f3ea"/>
  <text x="38" y="52" class="eyebrow">CURRENT WORKFLOW</text>
  <text x="38" y="101" class="heading">Current service workflow</text>
  <text x="38" y="135" class="deck">Request → completed job → report</text>

  <rect x="38" y="174" width="644" height="1238" rx="20" fill="#fffdf8" stroke="#d4cab9" stroke-width="2"/>

  <rect x="64" y="204" width="160" height="40" rx="20" fill="#f0c05a"/>
  <text x="144" y="231" text-anchor="middle" class="lane">CUSTOMER</text>
  <rect x="64" y="260" width="592" height="116" rx="15" fill="#fff7df" stroke="#d9a83b" stroke-width="2"/>
  <text x="88" y="297" class="step">1 · Request arrives</text>
  <text x="88" y="331" class="detail">Email · phone · WhatsApp · website form</text>

  <path d="M360 376 V420" stroke="#183153" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="64" y="432" width="194" height="40" rx="20" fill="#d7e7ee"/>
  <text x="161" y="459" text-anchor="middle" class="lane">COORDINATOR</text>
  <rect x="64" y="488" width="592" height="126" rx="15" fill="#edf5f8" stroke="#8bb1c0" stroke-width="2"/>
  <text x="88" y="526" class="step">2 · Retype the request</text>
  <text x="88" y="560" class="detail">Copy details into the intake spreadsheet</text>
  <text x="88" y="590" class="detail">and give the request a row</text>

  <path d="M360 614 V658" stroke="#183153" stroke-width="4" marker-end="url(#arrow)"/>
  <polygon points="360,670 496,762 360,854 224,762" fill="#fff4d6" stroke="#d9a83b" stroke-width="2"/>
  <text x="360" y="752" text-anchor="middle" class="step">Details complete?</text>
  <text x="360" y="784" text-anchor="middle" class="tag">NO: ASK CUSTOMER</text>
  <text x="360" y="810" text-anchor="middle" class="tag">THEN WAIT</text>

  <path d="M360 854 V898" stroke="#183153" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="64" y="910" width="242" height="40" rx="20" fill="#e6d8ec"/>
  <text x="185" y="937" text-anchor="middle" class="lane">OWNER / DISPATCH</text>
  <rect x="64" y="966" width="592" height="138" rx="15" fill="#f4edf6" stroke="#b89bc4" stroke-width="2"/>
  <text x="88" y="1004" class="step">3 · Approve, then assign</text>
  <text x="88" y="1038" class="detail">Owner reviews large quotes in chat.</text>
  <text x="88" y="1068" class="detail">Dispatcher checks the sheet, availability,</text>
  <text x="88" y="1098" class="detail">zone, skill and memory.</text>

  <path d="M360 1104 V1148" stroke="#183153" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="64" y="1160" width="174" height="40" rx="20" fill="#dce8ce"/>
  <text x="151" y="1187" text-anchor="middle" class="lane">FIELD CREW</text>
  <rect x="64" y="1216" width="592" height="126" rx="15" fill="#eff5e9" stroke="#9db77e" stroke-width="2"/>
  <text x="88" y="1254" class="step">4 · Complete the job</text>
  <text x="88" y="1288" class="detail">Crew sends status and photos in team chat.</text>
  <text x="88" y="1318" class="detail">Coordinator updates the sheet and report.</text>

  <rect x="38" y="1446" width="644" height="150" rx="20" fill="#183153"/>
  <text x="64" y="1485" class="calloutHead">What this map exposes</text>
  <text x="64" y="1522" class="calloutText">Status is copied between tools. Approval</text>
  <text x="64" y="1552" class="calloutText">can wait without a timer. Dispatch relies</text>
  <text x="64" y="1582" class="calloutText">on memory, and reporting repeats the work.</text>
</svg>
