<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Current service workflow</title>
  <desc id="desc">A six-step service workflow. Requests arrive through several channels, are retyped into a spreadsheet, wait for approval in chat, are assigned from memory, completed by the field crew, then copied back into the spreadsheet for reporting.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 13 7 1 13Z" fill="#183153"/></marker>
    <style>.eyebrow{font:700 18px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.4px;fill:#a4472a}.heading{font:700 38px Inter,Arial,sans-serif;fill:#152436}.deck{font:400 20px Inter,Arial,sans-serif;fill:#516071}.actor{font:700 14px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.7px;fill:#152436}.step{font:700 21px Inter,Arial,sans-serif;fill:#152436}.detail{font:400 17px Inter,Arial,sans-serif;fill:#526273}.calloutHead{font:700 20px Inter,Arial,sans-serif;fill:#fff}.calloutText{font:400 17px Inter,Arial,sans-serif;fill:#dce7f2}</style>
  </defs>
  <rect width="1200" height="900" fill="#f7f3ea"/>
  <text x="64" y="58" class="eyebrow">CURRENT WORKFLOW</text><text x="64" y="105" class="heading">A service request crosses four people and three tools</text><text x="64" y="139" class="deck">Meridian Facility Services · request to completed job to weekly report</text>
  <rect x="64" y="184" width="1072" height="500" rx="18" fill="#fffdf8" stroke="#d4cab9" stroke-width="2"/>
  <rect x="96" y="226" width="292" height="154" rx="16" fill="#fff7df" stroke="#d9a83b" stroke-width="2"/><rect x="116" y="246" width="112" height="30" rx="15" fill="#f0c05a"/><text x="172" y="266" text-anchor="middle" class="actor">CUSTOMER</text><text x="116" y="310" class="step">1 · Request arrives</text><text x="116" y="339" class="detail">Email, phone, WhatsApp</text><text x="116" y="363" class="detail">or a website form</text>
  <path d="M388 303 H438" fill="none" stroke="#183153" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="442" y="226" width="292" height="154" rx="16" fill="#edf5f8" stroke="#8bb1c0" stroke-width="2"/><rect x="462" y="246" width="138" height="30" rx="15" fill="#d7e7ee"/><text x="531" y="266" text-anchor="middle" class="actor">COORDINATOR</text><text x="462" y="310" class="step">2 · Retype and check</text><text x="462" y="339" class="detail">Create a spreadsheet row.</text><text x="462" y="363" class="detail">Chase any missing details.</text>
  <path d="M734 303 H784" fill="none" stroke="#183153" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="788" y="226" width="292" height="154" rx="16" fill="#f4edf6" stroke="#b89bc4" stroke-width="2"/><rect x="808" y="246" width="100" height="30" rx="15" fill="#e6d8ec"/><text x="858" y="266" text-anchor="middle" class="actor">OWNER</text><text x="808" y="310" class="step">3 · Approve in chat</text><text x="808" y="339" class="detail">Large quotes wait for review.</text><text x="808" y="363" class="detail">There’s no owner or timer.</text>
  <path d="M934 380 V428" fill="none" stroke="#183153" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="788" y="432" width="292" height="154" rx="16" fill="#f4edf6" stroke="#b89bc4" stroke-width="2"/><rect x="808" y="452" width="116" height="30" rx="15" fill="#e6d8ec"/><text x="866" y="472" text-anchor="middle" class="actor">DISPATCH</text><text x="808" y="516" class="step">4 · Assign from memory</text><text x="808" y="545" class="detail">Check the sheet, availability,</text><text x="808" y="569" class="detail">zone and skill.</text>
  <path d="M788 509 H738" fill="none" stroke="#183153" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="442" y="432" width="292" height="154" rx="16" fill="#eff5e9" stroke="#9db77e" stroke-width="2"/><rect x="462" y="452" width="128" height="30" rx="15" fill="#dce8ce"/><text x="526" y="472" text-anchor="middle" class="actor">FIELD CREW</text><text x="462" y="516" class="step">5 · Complete the job</text><text x="462" y="545" class="detail">Send the status and photos</text><text x="462" y="569" class="detail">back in team chat.</text>
  <path d="M442 509 H392" fill="none" stroke="#183153" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="96" y="432" width="292" height="154" rx="16" fill="#edf5f8" stroke="#8bb1c0" stroke-width="2"/><rect x="116" y="452" width="138" height="30" rx="15" fill="#d7e7ee"/><text x="185" y="472" text-anchor="middle" class="actor">COORDINATOR</text><text x="116" y="516" class="step">6 · Update and report</text><text x="116" y="545" class="detail">Copy the chat update into the</text><text x="116" y="569" class="detail">sheet and rebuild the report.</text>
  <rect x="64" y="724" width="1072" height="112" rx="18" fill="#183153"/><text x="88" y="758" class="calloutHead">What this map exposes</text><text x="88" y="788" class="calloutText">The request is copied between inbox, chat and the spreadsheet · approval can wait without an owner or timer</text><text x="88" y="815" class="calloutText">dispatch depends on memory · reporting repeats coordination work instead of reading one reliable record</text>
</svg>
