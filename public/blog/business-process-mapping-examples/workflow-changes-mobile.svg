<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1640" viewBox="0 0 720 1640" role="img" aria-labelledby="title desc">
  <title id="title">Four changes in the improved service workflow for mobile screens</title>
  <desc id="desc">A vertical before-and-after comparison covering intake, job status, approval, and reporting.</desc>
  <defs>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="15" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 15 8 1 15Z" fill="#183153"/></marker>
    <style>.eyebrow{font:700 20px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px;fill:#317159}.heading{font:700 34px Inter,Arial,sans-serif;fill:#152436}.deck{font:400 22px Inter,Arial,sans-serif;fill:#516071}.label{font:700 16px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.8px}.rowHead{font:700 25px Inter,Arial,sans-serif;fill:#152436}.rowText{font:400 21px Inter,Arial,sans-serif;fill:#526273}.calloutHead{font:700 24px Inter,Arial,sans-serif;fill:#fff}.calloutText{font:400 20px Inter,Arial,sans-serif;fill:#dce7f2}</style>
  </defs>
  <rect width="720" height="1640" fill="#eef5ef"/>
  <text x="38" y="52" class="eyebrow">WHAT CHANGES</text><text x="38" y="101" class="heading">Four useful changes</text><text x="38" y="137" class="deck">Current workflow → improved workflow</text>
  <text x="48" y="190" class="label" fill="#a4472a">CURRENT</text>
  <rect x="48" y="208" width="624" height="106" rx="16" fill="#f8eee8" stroke="#d4a08d" stroke-width="2"/><text x="72" y="248" class="rowHead">Different intake details</text><text x="72" y="282" class="rowText">Each channel asks for something different.</text>
  <path d="M360 314 V346" fill="none" stroke="#183153" stroke-width="3" marker-end="url(#arrow)"/><text x="48" y="376" class="label" fill="#317159">IMPROVED</text>
  <rect x="48" y="394" width="624" height="106" rx="16" fill="#e7f2e9" stroke="#78a686" stroke-width="2"/><text x="72" y="434" class="rowHead">One intake format</text><text x="72" y="468" class="rowText">Required details are captured the same way.</text>
  <rect x="48" y="530" width="624" height="106" rx="16" fill="#f8eee8" stroke="#d4a08d" stroke-width="2"/><text x="72" y="570" class="rowHead">Status is split across tools</text><text x="72" y="604" class="rowText">The sheet, chat and memory can disagree.</text>
  <path d="M360 636 V668" fill="none" stroke="#183153" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="48" y="686" width="624" height="106" rx="16" fill="#e7f2e9" stroke="#78a686" stroke-width="2"/><text x="72" y="726" class="rowHead">One shared job record</text><text x="72" y="760" class="rowText">Owner, status and next action stay together.</text>
  <rect x="48" y="822" width="624" height="106" rx="16" fill="#f8eee8" stroke="#d4a08d" stroke-width="2"/><text x="72" y="862" class="rowHead">Approval waits in chat</text><text x="72" y="896" class="rowText">A quote can sit until someone follows up.</text>
  <path d="M360 928 V960" fill="none" stroke="#183153" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="48" y="978" width="624" height="106" rx="16" fill="#e7f2e9" stroke="#78a686" stroke-width="2"/><text x="72" y="1018" class="rowHead">A named owner and timer</text><text x="72" y="1052" class="rowText">Exceptions have a clear follow-up.</text>
  <rect x="48" y="1114" width="624" height="106" rx="16" fill="#f8eee8" stroke="#d4a08d" stroke-width="2"/><text x="72" y="1154" class="rowHead">The report is rebuilt</text><text x="72" y="1188" class="rowText">The week is copied again by hand.</text>
  <path d="M360 1220 V1252" fill="none" stroke="#183153" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="48" y="1270" width="624" height="106" rx="16" fill="#e7f2e9" stroke="#78a686" stroke-width="2"/><text x="72" y="1310" class="rowHead">The report reads the record</text><text x="72" y="1344" class="rowText">Completed and stalled work is already visible.</text>
  <rect x="38" y="1432" width="644" height="150" rx="20" fill="#183153"/><text x="64" y="1472" class="calloutHead">Smallest useful first change</text><text x="64" y="1510" class="calloutText">Start with one shared job record containing</text><text x="64" y="1540" class="calloutText">an ID, owner, status and next action.</text>
</svg>
