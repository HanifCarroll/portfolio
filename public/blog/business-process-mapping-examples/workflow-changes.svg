<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Four changes in the improved service workflow</title>
  <desc id="desc">A before-and-after comparison. Different request channels adopt one intake format. Status split across a spreadsheet, chat, and memory moves into one shared job record. Approval waiting in chat gains a named owner and timer. A manually rebuilt report becomes a view of the job record.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 13 7 1 13Z" fill="#183153"/></marker>
    <style>.eyebrow{font:700 18px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.4px;fill:#317159}.heading{font:700 38px Inter,Arial,sans-serif;fill:#152436}.deck{font:400 20px Inter,Arial,sans-serif;fill:#516071}.column{font:700 15px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px}.rowHead{font:700 20px Inter,Arial,sans-serif;fill:#152436}.rowText{font:400 17px Inter,Arial,sans-serif;fill:#526273}.calloutHead{font:700 20px Inter,Arial,sans-serif;fill:#fff}.calloutText{font:400 17px Inter,Arial,sans-serif;fill:#dce7f2}</style>
  </defs>
  <rect width="1200" height="900" fill="#eef5ef"/>
  <text x="64" y="58" class="eyebrow">WHAT CHANGES</text>
  <text x="64" y="105" class="heading">Four changes make the workflow easier to trust</text>
  <text x="64" y="139" class="deck">The current tools can stay; the handoffs and recordkeeping change</text>
  <rect x="64" y="184" width="1072" height="500" rx="18" fill="#fbfefb" stroke="#bfcfc1" stroke-width="2"/>
  <text x="96" y="222" class="column" fill="#a4472a">CURRENT</text><text x="674" y="222" class="column" fill="#317159">IMPROVED</text>
  <rect x="96" y="244" width="430" height="92" rx="14" fill="#f8eee8" stroke="#d4a08d" stroke-width="2"/><text x="118" y="278" class="rowHead">Different intake details</text><text x="118" y="307" class="rowText">Each request channel asks for something different.</text>
  <path d="M526 290 H666" fill="none" stroke="#183153" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="674" y="244" width="430" height="92" rx="14" fill="#e7f2e9" stroke="#78a686" stroke-width="2"/><text x="696" y="278" class="rowHead">One intake format</text><text x="696" y="307" class="rowText">Required details are captured the same way.</text>
  <rect x="96" y="352" width="430" height="92" rx="14" fill="#f8eee8" stroke="#d4a08d" stroke-width="2"/><text x="118" y="386" class="rowHead">Status is split across tools</text><text x="118" y="415" class="rowText">The sheet, chat and memory tell different stories.</text>
  <path d="M526 398 H666" fill="none" stroke="#183153" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="674" y="352" width="430" height="92" rx="14" fill="#e7f2e9" stroke="#78a686" stroke-width="2"/><text x="696" y="386" class="rowHead">One shared job record</text><text x="696" y="415" class="rowText">Owner, status and next action stay together.</text>
  <rect x="96" y="460" width="430" height="92" rx="14" fill="#f8eee8" stroke="#d4a08d" stroke-width="2"/><text x="118" y="494" class="rowHead">Approval waits in chat</text><text x="118" y="523" class="rowText">A large quote can sit until someone follows up.</text>
  <path d="M526 506 H666" fill="none" stroke="#183153" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="674" y="460" width="430" height="92" rx="14" fill="#e7f2e9" stroke="#78a686" stroke-width="2"/><text x="696" y="494" class="rowHead">A named owner and timer</text><text x="696" y="523" class="rowText">Exceptions have a clear follow-up.</text>
  <rect x="96" y="568" width="430" height="92" rx="14" fill="#f8eee8" stroke="#d4a08d" stroke-width="2"/><text x="118" y="602" class="rowHead">The report is rebuilt</text><text x="118" y="631" class="rowText">The coordinator copies the week again by hand.</text>
  <path d="M526 614 H666" fill="none" stroke="#183153" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="674" y="568" width="430" height="92" rx="14" fill="#e7f2e9" stroke="#78a686" stroke-width="2"/><text x="696" y="602" class="rowHead">The report reads the record</text><text x="696" y="631" class="rowText">Completed and stalled work is already visible.</text>
  <rect x="64" y="724" width="1072" height="112" rx="18" fill="#183153"/>
  <text x="88" y="758" class="calloutHead">Smallest useful first change</text><text x="88" y="788" class="calloutText">Start with one shared job record containing an ID, owner, status and next action.</text><text x="88" y="815" class="calloutText">Keep the current request channels until the team trusts the record and its rules.</text>
</svg>
