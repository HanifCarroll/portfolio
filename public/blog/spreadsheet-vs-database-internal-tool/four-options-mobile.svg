<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1480" viewBox="0 0 720 1480" role="img" aria-labelledby="title desc">
  <title id="title">Four options for a growing spreadsheet workflow</title>
  <desc id="desc">A mobile decision guide comparing keeping a spreadsheet, adding controls to it, using existing business software, and building custom software.</desc>
  <rect width="720" height="1280" fill="#fbf6eb"/>
  <text x="42" y="62" fill="#13263f" font-family="Arial, sans-serif" font-size="31" font-weight="700">
    <tspan x="42" dy="0">Choose the smallest system</tspan>
    <tspan x="42" dy="38">that keeps work trustworthy</tspan>
  </text>
  <text x="42" y="154" fill="#556171" font-family="Arial, sans-serif" font-size="26">Move only when the workflow demands it.</text>

  <g transform="translate(42 196)">
    <rect width="636" height="250" fill="#fffdf8" stroke="#13263f" stroke-width="2"/>
    <rect width="12" height="250" fill="#f1c94b"/>
    <text x="36" y="52" fill="#13263f" font-family="Arial, sans-serif" font-size="28" font-weight="700">1  KEEP THE SPREADSHEET</text>
    <text x="36" y="100" fill="#39485a" font-family="Arial, sans-serif" font-size="28">
      <tspan x="36" dy="0">One owner or small team · One main list</tspan>
      <tspan x="36" dy="38">Flexible analysis · Low-cost mistakes</tspan>
    </text>
    <text x="36" y="203" fill="#a54f37" font-family="Arial, sans-serif" font-size="24" font-weight="700">MOVE WHEN</text>
    <text x="197" y="203" fill="#39485a" font-family="Arial, sans-serif" font-size="26">Status lives elsewhere.</text>
  </g>

  <g transform="translate(42 466)">
    <rect width="636" height="250" fill="#fffdf8" stroke="#13263f" stroke-width="2"/>
    <rect width="12" height="250" fill="#dce8ef"/>
    <text x="36" y="52" fill="#13263f" font-family="Arial, sans-serif" font-size="28" font-weight="700">2  ADD SPREADSHEET CONTROLS</text>
    <text x="36" y="100" fill="#39485a" font-family="Arial, sans-serif" font-size="28">
      <tspan x="36" dy="0">Named owner · Required fields</tspan>
      <tspan x="36" dy="38">Status lists · Forms · Protected logic</tspan>
    </text>
    <text x="36" y="203" fill="#a54f37" font-family="Arial, sans-serif" font-size="24" font-weight="700">MOVE WHEN</text>
    <text x="197" y="203" fill="#39485a" font-family="Arial, sans-serif" font-size="26">Records relate; access differs.</text>
  </g>

  <g transform="translate(42 736)">
    <rect width="636" height="250" fill="#fffdf8" stroke="#13263f" stroke-width="2"/>
    <rect width="12" height="250" fill="#d9e7d6"/>
    <text x="36" y="52" fill="#13263f" font-family="Arial, sans-serif" font-size="28" font-weight="700">3  USE EXISTING SOFTWARE</text>
    <text x="36" y="100" fill="#39485a" font-family="Arial, sans-serif" font-size="28">
      <tspan x="36" dy="0">Linked records · Permissions</tspan>
      <tspan x="36" dy="38">Views · Forms · History · Automation</tspan>
    </text>
    <text x="36" y="203" fill="#a54f37" font-family="Arial, sans-serif" font-size="24" font-weight="700">MOVE WHEN</text>
    <text x="197" y="203" fill="#39485a" font-family="Arial, sans-serif" font-size="26">People work around it daily.</text>
  </g>

  <g transform="translate(42 1006)">
    <rect width="636" height="250" fill="#fffdf8" stroke="#13263f" stroke-width="2"/>
    <rect width="12" height="250" fill="#c96e4d"/>
    <text x="36" y="52" fill="#13263f" font-family="Arial, sans-serif" font-size="28" font-weight="700">4  BUILD CUSTOM SOFTWARE</text>
    <text x="36" y="100" fill="#39485a" font-family="Arial, sans-serif" font-size="28">
      <tspan x="36" dy="0">Stable workflow · Role-specific actions</tspan>
      <tspan x="36" dy="38">Approvals · Exceptions · Field use</tspan>
    </text>
    <text x="36" y="203" fill="#a54f37" font-family="Arial, sans-serif" font-size="24" font-weight="700">BUILD ONLY IF</text>
    <text x="220" y="203" fill="#39485a" font-family="Arial, sans-serif" font-size="26">Tested products leave a real gap.</text>
  </g>

  <rect x="42" y="1284" width="636" height="126" fill="#13263f"/>
  <text x="360" y="1326" text-anchor="middle" fill="#fffdf8" font-family="Arial, sans-serif" font-size="27" font-weight="700">
    <tspan x="360" dy="0">Coordination, control, and consequence decide.</tspan>
    <tspan x="360" dy="38">Row count is context.</tspan>
  </text>
</svg>
