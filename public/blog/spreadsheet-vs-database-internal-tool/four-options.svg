<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Four options for a growing spreadsheet workflow</title>
  <desc id="desc">A decision guide comparing keeping a spreadsheet, adding controls to it, using existing business software, and building custom software.</desc>
  <rect width="1200" height="720" fill="#fbf6eb"/>
  <text x="64" y="70" fill="#13263f" font-family="Arial, sans-serif" font-size="34" font-weight="700">Choose the smallest system that keeps the work trustworthy</text>
  <text x="64" y="108" fill="#556171" font-family="Arial, sans-serif" font-size="20">Start with the workflow. Move only when the current option cannot support it.</text>

  <g transform="translate(64 150)">
    <rect width="250" height="456" fill="#fffdf8" stroke="#13263f" stroke-width="2"/>
    <rect width="250" height="12" fill="#f1c94b"/>
    <text x="22" y="58" fill="#13263f" font-family="Arial, sans-serif" font-size="18" font-weight="700">1  KEEP THE SHEET</text>
    <text x="22" y="102" fill="#13263f" font-family="Arial, sans-serif" font-size="22" font-weight="700">Best fit</text>
    <text x="22" y="137" fill="#39485a" font-family="Arial, sans-serif" font-size="18">
      <tspan x="22" dy="0">One owner or</tspan>
      <tspan x="22" dy="27">a small team</tspan>
      <tspan x="22" dy="38">One main list</tspan>
      <tspan x="22" dy="38">Flexible analysis</tspan>
      <tspan x="22" dy="38">Low-cost mistakes</tspan>
    </text>
    <line x1="22" y1="310" x2="228" y2="310" stroke="#d7d2c7" stroke-width="2"/>
    <text x="22" y="348" fill="#a54f37" font-family="Arial, sans-serif" font-size="18" font-weight="700">MOVE WHEN</text>
    <text x="22" y="383" fill="#39485a" font-family="Arial, sans-serif" font-size="18">
      <tspan x="22" dy="0">Status lives in chat,</tspan>
      <tspan x="22" dy="27">copies, or memory.</tspan>
    </text>
  </g>

  <g transform="translate(338 150)">
    <rect width="250" height="456" fill="#fffdf8" stroke="#13263f" stroke-width="2"/>
    <rect width="250" height="12" fill="#dce8ef"/>
    <text x="22" y="58" fill="#13263f" font-family="Arial, sans-serif" font-size="18" font-weight="700">2  ADD CONTROLS</text>
    <text x="22" y="102" fill="#13263f" font-family="Arial, sans-serif" font-size="22" font-weight="700">Add control</text>
    <text x="22" y="137" fill="#39485a" font-family="Arial, sans-serif" font-size="18">
      <tspan x="22" dy="0">Named owner</tspan>
      <tspan x="22" dy="38">Required fields</tspan>
      <tspan x="22" dy="38">Status lists + forms</tspan>
      <tspan x="22" dy="38">Protected logic</tspan>
      <tspan x="22" dy="38">Change review</tspan>
    </text>
    <line x1="22" y1="310" x2="228" y2="310" stroke="#d7d2c7" stroke-width="2"/>
    <text x="22" y="348" fill="#a54f37" font-family="Arial, sans-serif" font-size="18" font-weight="700">MOVE WHEN</text>
    <text x="22" y="383" fill="#39485a" font-family="Arial, sans-serif" font-size="18">
      <tspan x="22" dy="0">Records must relate or</tspan>
      <tspan x="22" dy="27">access must differ.</tspan>
    </text>
  </g>

  <g transform="translate(612 150)">
    <rect width="250" height="456" fill="#fffdf8" stroke="#13263f" stroke-width="2"/>
    <rect width="250" height="12" fill="#d9e7d6"/>
    <text x="22" y="58" fill="#13263f" font-family="Arial, sans-serif" font-size="16" font-weight="700">3  USE EXISTING SOFTWARE</text>
    <text x="22" y="102" fill="#13263f" font-family="Arial, sans-serif" font-size="22" font-weight="700">Connect records</text>
    <text x="22" y="137" fill="#39485a" font-family="Arial, sans-serif" font-size="18">
      <tspan x="22" dy="0">Linked records</tspan>
      <tspan x="22" dy="38">Role permissions</tspan>
      <tspan x="22" dy="38">Views + forms</tspan>
      <tspan x="22" dy="38">Change history</tspan>
      <tspan x="22" dy="38">Basic automation</tspan>
    </text>
    <line x1="22" y1="310" x2="228" y2="310" stroke="#d7d2c7" stroke-width="2"/>
    <text x="22" y="348" fill="#a54f37" font-family="Arial, sans-serif" font-size="18" font-weight="700">MOVE WHEN</text>
    <text x="22" y="383" fill="#39485a" font-family="Arial, sans-serif" font-size="18">
      <tspan x="22" dy="0">People work around</tspan>
      <tspan x="22" dy="27">the product every day.</tspan>
    </text>
  </g>

  <g transform="translate(886 150)">
    <rect width="250" height="456" fill="#fffdf8" stroke="#13263f" stroke-width="2"/>
    <rect width="250" height="12" fill="#c96e4d"/>
    <text x="22" y="58" fill="#13263f" font-family="Arial, sans-serif" font-size="16" font-weight="700">4  BUILD CUSTOM SOFTWARE</text>
    <text x="22" y="102" fill="#13263f" font-family="Arial, sans-serif" font-size="22" font-weight="700">Fit the workflow</text>
    <text x="22" y="137" fill="#39485a" font-family="Arial, sans-serif" font-size="18">
      <tspan x="22" dy="0">Stable process</tspan>
      <tspan x="22" dy="38">Role-specific actions</tspan>
      <tspan x="22" dy="38">Approvals + exceptions</tspan>
      <tspan x="22" dy="38">Field or mobile use</tspan>
      <tspan x="22" dy="38">Material recurring cost</tspan>
    </text>
    <line x1="22" y1="310" x2="228" y2="310" stroke="#d7d2c7" stroke-width="2"/>
    <text x="22" y="348" fill="#a54f37" font-family="Arial, sans-serif" font-size="18" font-weight="700">BUILD ONLY IF</text>
    <text x="22" y="383" fill="#39485a" font-family="Arial, sans-serif" font-size="18">
      <tspan x="22" dy="0">Tested products leave</tspan>
      <tspan x="22" dy="27">a justified gap.</tspan>
    </text>
  </g>

  <rect x="64" y="632" width="1072" height="48" fill="#13263f"/>
  <text x="600" y="663" text-anchor="middle" fill="#fffdf8" font-family="Arial, sans-serif" font-size="20" font-weight="700">Coordination, control, and consequence set the threshold — not row count alone.</text>
</svg>
