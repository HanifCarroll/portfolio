<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">Casamo report preparation before and after</title><desc id="desc">Before: each pick got walking routes, then its report and translation, one pick at a time, before publishing. After: reports, translations, and walking routes for all picks run in parallel, then join before publishing.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#4c6470"/></marker></defs><rect width="1000" height="500" rx="20" fill="#f8faf8"/><line x1="500" y1="40" x2="500" y2="460" stroke="#d7e4dd" stroke-width="2"/><text x="240" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#173b38">Before</text><text x="750" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#173b38">After</text><rect x="90" y="100" width="300" height="56" rx="12" fill="#e8f1ed" stroke="#39776d" stroke-width="2"/><text x="240.0" y="136.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#173b38">Final picks</text><polyline points="240,156 240,182" fill="none" stroke="#4c6470" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="90" y="186" width="300" height="76" rx="12" fill="#e8f1ed" stroke="#39776d" stroke-width="2"/><text x="240.0" y="219.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#173b38">Walking routes</text><text x="240.0" y="245.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#173b38">for one pick</text><polyline points="240,262 240,288" fill="none" stroke="#4c6470" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="90" y="292" width="300" height="76" rx="12" fill="#e8f1ed" stroke="#39776d" stroke-width="2"/><text x="240.0" y="325.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#173b38">Report and translation</text><text x="240.0" y="351.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#173b38">for that pick</text><polyline points="390,330 436,330 436,224 394,224" fill="none" stroke="#4c6470" stroke-width="2.5" marker-end="url(#arrow)"/><text x="446" y="272" font-family="Arial, sans-serif" font-size="18" fill="#536b65">Next</text><text x="446" y="294" font-family="Arial, sans-serif" font-size="18" fill="#536b65">pick</text><polyline points="240,368 240,412" fill="none" stroke="#4c6470" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="90" y="416" width="300" height="56" rx="12" fill="#e8f1ed" stroke="#39776d" stroke-width="2"/><text x="240.0" y="452.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#173b38">Publish</text><rect x="600" y="100" width="300" height="56" rx="12" fill="#e8f1ed" stroke="#39776d" stroke-width="2"/><text x="750.0" y="136.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#173b38">Final picks</text><polyline points="750,156 750,170 630,170 630,182" fill="none" stroke="#4c6470" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="750,170 870,170 870,182" fill="none" stroke="#4c6470" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="530" y="186" width="200" height="76" rx="12" fill="#e8f1ed" stroke="#39776d" stroke-width="2"/><text x="630.0" y="219.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#173b38">All reports and</text><text x="630.0" y="245.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#173b38">translations</text><rect x="770" y="186" width="200" height="76" rx="12" fill="#e8f1ed" stroke="#39776d" stroke-width="2"/><text x="870.0" y="219.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#173b38">All walking</text><text x="870.0" y="245.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#173b38">routes</text><polyline points="630,262 630,300 750,300" fill="none" stroke="#4c6470" stroke-width="2.5"/><polyline points="870,262 870,300 750,300" fill="none" stroke="#4c6470" stroke-width="2.5"/><polyline points="750,300 750,412" fill="none" stroke="#4c6470" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="600" y="416" width="300" height="56" rx="12" fill="#e8f1ed" stroke="#39776d" stroke-width="2"/><text x="750.0" y="452.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#173b38">Publish</text></svg>