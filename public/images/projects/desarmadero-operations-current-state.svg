<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1016" viewBox="0 0 1440 1016" role="img" aria-labelledby="title desc">
  <title id="title">Current state — Desarmadero operations</title>
  <desc id="desc">Reconstructed current-state swimlane workflow: counter staff fill a budget sheet and print two copies. Cash desk collects payment, files one copy for later reconciliation and returns the other for dispatch. The downstream vehicle lookup and extraction are inferred from the call.</desc>
  <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7Z" fill="#575a51"/></marker></defs>
  <style>
    text{font-family:'Helvetica Neue',Arial,sans-serif;fill:#282828} .eyebrow{font-size:15px;font-weight:600;letter-spacing:1.8px} .title{font-family:Georgia,serif;font-size:37px} .subtitle{font-size:19px;fill:#504945} .stage{font-size:17px;font-weight:500} .stage-num{font-size:13px;fill:#6c6e65;font-family:Consolas,monospace} .role{font-size:20px;font-weight:600} .role-sub{font-size:16px;fill:#65675e} .node{fill:white;stroke:#b9bdb2;stroke-width:1.25} .node.paper{fill:#fffcf2} .node.key{fill:#f8d651;stroke:#cfad31} .node.inferred{fill:#fafaf7;stroke-dasharray:5 4} .node.support{fill:#f3f4ef} .node-title{font-size:19px;font-weight:600} .body{font-size:17px;fill:#504945} .connector{fill:none;stroke:#575a51;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round} .connector.dashed{stroke-dasharray:5 5} .edge-label{font-size:15px;fill:#504945;paint-order:stroke;stroke:#fff;stroke-width:6px;stroke-linejoin:round} .note{font-size:16px;fill:#504945} .note-title{font-size:16px;font-weight:600} .footer{font-size:14px;fill:#696c62} .empty{font-size:17px;fill:#73766b;font-style:italic}
  </style><rect width="1440" height="1016" fill="#fff"/><rect x="40" y="38" width="7" height="22" fill="#f8d651"/><text x="60" y="55" class="eyebrow" >CURRENT STATE</text><text x="1400" y="55" class="footer" text-anchor="end">DESARMADERO / OPERATIONS</text><text x="40" y="112" class="title" >Paper carries the work between roles.</text><text x="40" y="150" class="subtitle" >Reconstructed from discovery · Customer request → part extraction</text><text x="270" y="193" class="stage-num" >01</text><text x="299" y="193" class="stage" >Capture request</text><text x="494" y="193" class="stage-num" >02</text><text x="523" y="193" class="stage" >Confirm payment</text><text x="718" y="193" class="stage-num" >03</text><text x="747" y="193" class="stage" >Assign work</text><text x="942" y="193" class="stage-num" >04</text><text x="971" y="193" class="stage" >Locate vehicle</text><text x="1166" y="193" class="stage-num" >05</text><text x="1195" y="193" class="stage" >Complete work</text><rect x="40" y="218" width="1360" height="132" fill="#f4f5f0"/><line x1="40" y1="218" x2="1400" y2="218" stroke="#dfe2d8"/><text x="61" y="264" class="role" >Counter staff</text><text x="61" y="290" class="role-sub" >Sale / presupuesto</text><rect x="40" y="350" width="1360" height="220" fill="#fafbf8"/><line x1="40" y1="350" x2="1400" y2="350" stroke="#dfe2d8"/><text x="61" y="396" class="role" >Cash desk</text><text x="61" y="422" class="role-sub" >Payment / caja</text><rect x="40" y="570" width="1360" height="130" fill="#f4f5f0"/><line x1="40" y1="570" x2="1400" y2="570" stroke="#dfe2d8"/><text x="61" y="616" class="role" >Dismantling</text><text x="61" y="642" class="role-sub" >manager</text><rect x="40" y="700" width="1360" height="150" fill="#fafbf8"/><line x1="40" y1="700" x2="1400" y2="700" stroke="#dfe2d8"/><text x="61" y="746" class="role" >Dismantler</text><text x="61" y="772" class="role-sub" >Parts extraction</text><rect x="40" y="850" width="1360" height="126" fill="#f4f5f0"/><line x1="40" y1="850" x2="1400" y2="850" stroke="#dfe2d8"/><text x="61" y="896" class="role" >Yard / map</text><text x="61" y="922" class="role-sub" >Existing layout</text><line x1="242" y1="218" x2="242" y2="976" stroke="#dfe2d8"/><line x1="40" y1="976" x2="1400" y2="976" stroke="#dfe2d8"/><path d="M468 284 H480 V411 H494" class="connector" marker-end="url(#arrow)"/><path d="M593 367 V360 H817 V328" class="connector" marker-end="url(#arrow)"/><path d="M593 455 V477" class="connector" marker-end="url(#arrow)"/><path d="M916 284 H930 V716 H817 V732" class="connector" marker-end="url(#arrow)"/><path d="M916 776 H942" class="connector dashed" marker-end="url(#arrow)"/><path d="M1140 776 H1166" class="connector dashed" marker-end="url(#arrow)"/><path d="M1041 870 V820" class="connector dashed" marker-end="url(#arrow)"/><text x="666" y="351" class="edge-label" >Second copy returned</text><text x="606" y="470" class="edge-label" >First copy</text><text x="944" y="684" class="edge-label" >Paper handed to worker</text><g ><rect x="270" y="240" width="198" height="88" rx="7" class="node paper"/><text x="286" y="270" class="node-title" >Write budget sheet</text><text x="286" y="295" class="body" >Print two copies</text><text x="286" y="316" class="body" >Client, vehicle, parts</text></g><g ><rect x="494" y="367" width="198" height="88" rx="7" class="node paper"/><text x="510" y="397" class="node-title" >Collect payment</text><text x="510" y="422" class="body" >Deposit or full amount</text><text x="510" y="443" class="body" >Receive printed order</text></g><g ><rect x="494" y="477" width="198" height="88" rx="7" class="node paper"/><text x="510" y="507" class="node-title" >File first copy</text><text x="510" y="532" class="body" >Later: total paper</text><text x="510" y="553" class="body" >records by seller</text></g><g ><rect x="718" y="240" width="198" height="88" rx="7" class="node paper"/><text x="734" y="270" class="node-title" >Dispatch paper</text><text x="734" y="295" class="body" >Copy back from caja</text><text x="734" y="316" class="body" >Pass it to a dismantler</text></g><g ><rect x="718" y="732" width="198" height="88" rx="7" class="node paper"/><text x="734" y="762" class="node-title" >Receive order</text><text x="734" y="787" class="body" >Paper work instruction</text><text x="734" y="808" class="body" >Requested parts</text></g><g ><rect x="942" y="732" width="198" height="88" rx="7" class="node inferred"/><text x="958" y="762" class="node-title" >Locate vehicle</text><text x="958" y="787" class="body" >Use the recorded</text><text x="958" y="808" class="body" >vehicle location</text></g><g ><rect x="1166" y="732" width="198" height="88" rx="7" class="node inferred"/><text x="1182" y="762" class="node-title" >Extract part</text><text x="1182" y="787" class="body" >Downstream step</text><text x="1182" y="808" class="body" >inferred from the call</text></g><g ><rect x="942" y="870" width="198" height="88" rx="7" class="node support"/><text x="958" y="900" class="node-title" >Physical yard map</text><text x="958" y="925" class="body" >Numbered rows</text><text x="958" y="946" class="body" >and vehicle positions</text></g><text x="290" y="626" class="empty" >No separate manager handoff is established in the discovery call.</text><text x="290" y="653" class="empty" >The counter sends the paper order to a dismantler.</text></svg>