<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1016" viewBox="0 0 1440 1016" role="img" aria-labelledby="title desc">
  <title id="title">Proposed target state — Desarmadero operations</title>
  <desc id="desc">Proposed Phase 1 swimlane workflow: a seller records parts without requiring stock; cash desk records payment and releases work; the dismantling manager assigns it; the dismantler opens their own orders, locates the vehicle and records work performed. An administrator maintains the map. Unpaid orders remain hidden; missing locations require clarification.</desc>
  <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7Z" fill="#575a51"/></marker></defs>
  <style>
    text{font-family:'Helvetica Neue',Arial,sans-serif;fill:#282828} .eyebrow{font-size:15px;font-weight:600;letter-spacing:1.8px} .title{font-family:Georgia,serif;font-size:37px} .subtitle{font-size:19px;fill:#504945} .stage{font-size:17px;font-weight:500} .stage-num{font-size:13px;fill:#6c6e65;font-family:Consolas,monospace} .role{font-size:20px;font-weight:600} .role-sub{font-size:16px;fill:#65675e} .node{fill:white;stroke:#b9bdb2;stroke-width:1.25} .node.paper{fill:#fffcf2} .node.key{fill:#f8d651;stroke:#cfad31} .node.inferred{fill:#fafaf7;stroke-dasharray:5 4} .node.support{fill:#f3f4ef} .node-title{font-size:19px;font-weight:600} .body{font-size:17px;fill:#504945} .connector{fill:none;stroke:#575a51;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round} .connector.dashed{stroke-dasharray:5 5} .edge-label{font-size:15px;fill:#504945;paint-order:stroke;stroke:#fff;stroke-width:6px;stroke-linejoin:round} .note{font-size:16px;fill:#504945} .note-title{font-size:16px;font-weight:600} .footer{font-size:14px;fill:#696c62} .empty{font-size:17px;fill:#73766b;font-style:italic}
  </style><rect width="1440" height="1016" fill="#fff"/><rect x="40" y="38" width="7" height="22" fill="#f8d651"/><text x="60" y="55" class="eyebrow" >PROPOSED TARGET STATE</text><text x="1400" y="55" class="footer" text-anchor="end">DESARMADERO / OPERATIONS</text><text x="40" y="112" class="title" >A shared order moves the work forward.</text><text x="40" y="150" class="subtitle" >Phase 1 design · Customer request → extraction and work recorded</text><text x="270" y="193" class="stage-num" >01</text><text x="299" y="193" class="stage" >Capture request</text><text x="494" y="193" class="stage-num" >02</text><text x="523" y="193" class="stage" >Confirm payment</text><text x="718" y="193" class="stage-num" >03</text><text x="747" y="193" class="stage" >Assign work</text><text x="942" y="193" class="stage-num" >04</text><text x="971" y="193" class="stage" >Locate vehicle</text><text x="1166" y="193" class="stage-num" >05</text><text x="1195" y="193" class="stage" >Complete work</text><rect x="40" y="218" width="1360" height="132" fill="#f4f5f0"/><line x1="40" y1="218" x2="1400" y2="218" stroke="#dfe2d8"/><text x="61" y="264" class="role" >Counter staff</text><text x="61" y="290" class="role-sub" >Sale / presupuesto</text><rect x="40" y="350" width="1360" height="220" fill="#fafbf8"/><line x1="40" y1="350" x2="1400" y2="350" stroke="#dfe2d8"/><text x="61" y="396" class="role" >Cash desk</text><text x="61" y="422" class="role-sub" >Payment / caja</text><rect x="40" y="570" width="1360" height="130" fill="#f4f5f0"/><line x1="40" y1="570" x2="1400" y2="570" stroke="#dfe2d8"/><text x="61" y="616" class="role" >Dismantling</text><text x="61" y="642" class="role-sub" >manager</text><rect x="40" y="700" width="1360" height="150" fill="#fafbf8"/><line x1="40" y1="700" x2="1400" y2="700" stroke="#dfe2d8"/><text x="61" y="746" class="role" >Dismantler</text><text x="61" y="772" class="role-sub" >Parts extraction</text><rect x="40" y="850" width="1360" height="126" fill="#f4f5f0"/><line x1="40" y1="850" x2="1400" y2="850" stroke="#dfe2d8"/><text x="61" y="896" class="role" >Yard / map</text><text x="61" y="922" class="role-sub" >Administrator</text><line x1="242" y1="218" x2="242" y2="976" stroke="#dfe2d8"/><line x1="40" y1="976" x2="1400" y2="976" stroke="#dfe2d8"/><path d="M468 284 H480 V411 H494" class="connector" marker-end="url(#arrow)"/><path d="M593 455 V478" class="connector" marker-end="url(#arrow)"/><path d="M529 512 H468" class="connector" marker-end="url(#arrow)"/><path d="M369 480 V462 H480 V411 H494" class="connector" marker-end="url(#arrow)"/><path d="M657 512 H817 V591" class="connector" marker-end="url(#arrow)"/><path d="M817 679 V732" class="connector" marker-end="url(#arrow)"/><path d="M916 776 H942" class="connector" marker-end="url(#arrow)"/><path d="M1140 776 H1166" class="connector" marker-end="url(#arrow)"/><path d="M1041 870 V820" class="connector dashed" marker-end="url(#arrow)"/><text x="484" y="342" class="edge-label" >Order created</text><text x="486" y="503" class="edge-label" >No</text><text x="671" y="503" class="edge-label" >Yes · release</text><text x="831" y="716" class="edge-label" >Assigned work</text><g ><rect x="270" y="240" width="198" height="88" rx="7" class="node "/><text x="286" y="270" class="node-title" >Record sale</text><text x="286" y="295" class="body" >Free-text parts</text><text x="286" y="316" class="body" >No stock prerequisite</text></g><g ><rect x="494" y="367" width="198" height="88" rx="7" class="node "/><text x="510" y="397" class="node-title" >Review payment</text><text x="510" y="422" class="body" >Deposit or full amount</text><text x="510" y="443" class="body" >Amount and method</text></g><g ><rect x="270" y="480" width="198" height="66" rx="7" class="node support"/><text x="286" y="510" class="node-title" >Keep pending</text><text x="286" y="535" class="body" >Not visible to worker</text></g><path d="M593 478 L657 512 L593 546 L529 512 Z" fill="#f8d651" stroke="#cfad31" stroke-width="1.25"/><text x="593" y="507" class="stage" text-anchor="middle">Payment</text><text x="593" y="526" class="stage" text-anchor="middle">recorded?</text><g ><rect x="718" y="591" width="198" height="88" rx="7" class="node key"/><text x="734" y="621" class="node-title" >Assign order</text><text x="734" y="646" class="body" >Released work only</text><text x="734" y="667" class="body" >Choose a dismantler</text></g><g ><rect x="718" y="732" width="198" height="88" rx="7" class="node "/><text x="734" y="762" class="node-title" >Open own orders</text><text x="734" y="787" class="body" >Assigned work only</text><text x="734" y="808" class="body" >Mobile access</text></g><g ><rect x="942" y="732" width="198" height="88" rx="7" class="node "/><text x="958" y="762" class="node-title" >Locate vehicle</text><text x="958" y="787" class="body" >Open order’s map</text><text x="958" y="808" class="body" >See vehicle position</text></g><g ><rect x="1166" y="732" width="198" height="88" rx="7" class="node "/><text x="1182" y="762" class="node-title" >Extract part</text><text x="1182" y="787" class="body" >Mark work performed</text><text x="1182" y="808" class="body" >in the order</text></g><g ><rect x="942" y="870" width="198" height="88" rx="7" class="node support"/><text x="958" y="900" class="node-title" >Maintain map</text><text x="958" y="925" class="body" >Update vehicles</text><text x="958" y="946" class="body" >and their locations</text></g></svg>