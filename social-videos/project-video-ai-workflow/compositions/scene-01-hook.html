<!doctype html>
<html lang="en">
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Portfolio Inter";
          font-style: normal;
          font-weight: 400;
          font-display: block;
          src: url("assets/fonts/inter-latin-400-normal.woff2") format("woff2");
        }

        @font-face {
          font-family: "Portfolio Inter";
          font-style: normal;
          font-weight: 700;
          font-display: block;
          src: url("assets/fonts/inter-latin-700-normal.woff2") format("woff2");
        }

        @font-face {
          font-family: "Portfolio EB Garamond";
          font-style: normal;
          font-weight: 700;
          font-display: block;
          src: url("assets/fonts/eb-garamond-latin-700-normal.woff2") format("woff2");
        }

        @font-face {
          font-family: "Portfolio IBM Plex Mono";
          font-style: normal;
          font-weight: 700;
          font-display: block;
          src: url("assets/fonts/ibm-plex-mono-latin-700-normal.woff2") format("woff2");
        }

        #root {
          position: absolute;
          inset: 0;
          width: 1080px;
          height: 1080px;
          overflow: hidden;
          color: #171512;
          font-family: "Portfolio Inter", sans-serif;
          pointer-events: none;
        }

        .kicker {
          position: absolute;
          top: 92px;
          left: 92px;
          display: flex;
          align-items: center;
          gap: 14px;
          color: #0066ff;
          font:
            700 24px/1 "Portfolio IBM Plex Mono",
            monospace;
          letter-spacing: 0.08em;
          text-transform: uppercase;
        }

        .kicker::before {
          width: 42px;
          height: 4px;
          content: "";
          background: #0066ff;
        }

        .headline {
          position: absolute;
          top: 146px;
          left: 92px;
          width: 896px;
          margin: 0;
          font:
            700 96px/1.02 "Portfolio EB Garamond",
            serif;
          letter-spacing: -0.045em;
        }

        .headline span {
          display: block;
        }

        .headline span + span {
          margin-top: 18px;
        }

        .count-chip {
          position: absolute;
          top: 166px;
          right: 92px;
          display: grid;
          width: 168px;
          height: 136px;
          padding: 18px;
          border: 3px solid #171512;
          background: #fffcf6;
          box-shadow: 12px 12px 0 #0066ff;
        }

        .count-chip strong {
          align-self: end;
          font:
            700 68px/0.8 "Portfolio IBM Plex Mono",
            monospace;
          letter-spacing: -0.07em;
        }

        .count-chip span {
          color: #3a352f;
          font:
            700 20px/1.1 "Portfolio IBM Plex Mono",
            monospace;
          text-transform: uppercase;
        }

        .proof-stage {
          position: absolute;
          inset: 0;
        }

        .proof-card {
          position: absolute;
          top: 50%;
          left: 50%;
          width: 260px;
          height: 146px;
          overflow: hidden;
          border: 3px solid #171512;
          border-radius: 12px;
          background: #fffcf6;
          box-shadow: 0 16px 34px rgba(23, 21, 18, 0.18);
          transform: translate(-50%, -50%);
          will-change: transform;
        }

        .proof-card img {
          display: block;
          width: 100%;
          height: 100%;
          object-fit: contain;
          background: #171512;
        }

        .proof-card::after {
          position: absolute;
          inset: 8px;
          content: "";
          border: 2px solid rgba(255, 252, 246, 0.78);
          border-radius: 6px;
        }

        .proof-card::before {
          position: absolute;
          inset: 22px;
          content: "";
          background:
            linear-gradient(90deg, #0066ff 0 32%, transparent 32% 100%) 0 0 / 100% 12px no-repeat,
            linear-gradient(90deg, #171512 0 78%, transparent 78% 100%) 0 40px / 100% 10px no-repeat,
            linear-gradient(90deg, #696158 0 56%, transparent 56% 100%) 0 72px / 100% 8px no-repeat;
          opacity: 0.88;
        }

        .proof-card:nth-child(2n)::before {
          background:
            linear-gradient(90deg, #1d6f58 0 44%, transparent 44% 100%) 0 0 / 100% 12px no-repeat,
            linear-gradient(90deg, #171512 0 64%, transparent 64% 100%) 0 40px / 100% 10px no-repeat,
            linear-gradient(90deg, #696158 0 82%, transparent 82% 100%) 0 72px / 100% 8px no-repeat;
        }

        .meta-rail {
          position: absolute;
          right: 92px;
          bottom: 92px;
          left: 92px;
          display: flex;
          justify-content: space-between;
          padding-top: 16px;
          border-top: 3px solid #171512;
          color: #3a352f;
          font:
            700 22px/1 "Portfolio IBM Plex Mono",
            monospace;
          letter-spacing: 0.04em;
          text-transform: uppercase;
        }

        .meta-rail b {
          color: #0066ff;
        }

        .registration {
          position: absolute;
          width: 30px;
          height: 30px;
          border-color: #0066ff;
        }

        .registration.top-left {
          top: 392px;
          left: 72px;
          border-top: 4px solid #0066ff;
          border-left: 4px solid #0066ff;
        }

        .registration.bottom-right {
          right: 72px;
          bottom: 138px;
          border-right: 4px solid #0066ff;
          border-bottom: 4px solid #0066ff;
        }
      </style>

      <div
        id="root"
        data-composition-id="scene-01-hook"
        data-width="1080"
        data-height="1080"
        data-duration="4"
      >
        <h1
          id="scene-01-headline"
          class="headline"
          data-text-start="0.08"
          data-text-duration="0.54"
        >
          <span>21 projects.</span>
          <span>One video system.</span>
        </h1>

        <div class="proof-stage">
          <div class="proof-card" data-target-x="-300" data-target-y="70"></div>
          <div class="proof-card" data-target-x="0" data-target-y="70"></div>
          <div class="proof-card" data-target-x="300" data-target-y="70"></div>
          <div class="proof-card" data-target-x="-300" data-target-y="260"></div>
          <div class="proof-card" data-target-x="0" data-target-y="260"></div>
          <div class="proof-card" data-target-x="300" data-target-y="260"></div>
        </div>

        <div class="registration top-left" data-layout-ignore></div>
        <div class="registration bottom-right" data-layout-ignore></div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const root = document.querySelector('[data-composition-id="scene-01-hook"]');
        const tl = gsap.timeline({ paused: true });
        const cards = root.querySelectorAll(".proof-card");
        const headline = root.querySelector("#scene-01-headline");

        tl.fromTo(
          headline,
          { opacity: 0, y: 38 },
          {
            opacity: 1,
            y: 0,
            duration: Number(headline.dataset.textDuration),
            ease: "power4.out",
          },
          Number(headline.dataset.textStart),
        );

        cards.forEach((card, index) => {
          const targetX = Number(card.dataset.targetX);
          const targetY = Number(card.dataset.targetY);
          tl.fromTo(
            card,
            {
              xPercent: -50,
              yPercent: -50,
              x: targetX * 0.24,
              y: targetY * 0.24,
              scale: 0.58,
              opacity: 0,
              rotation: index % 2 === 0 ? -5 : 5,
            },
            {
              x: targetX,
              y: targetY,
              scale: 1,
              opacity: 1,
              rotation: 0,
              duration: 1.05,
              ease: "power3.out",
            },
            0.56 + index * 0.055,
          );
        });

        window.__timelines["scene-01-hook"] = tl;
      </script>
    </template>
  </body>
</html>
