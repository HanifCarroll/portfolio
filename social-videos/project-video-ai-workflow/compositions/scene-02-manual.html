<!doctype html>
<html lang="en">
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Portfolio Inter";
          font-style: normal;
          font-weight: 400;
          font-display: block;
          src: url("assets/fonts/inter-latin-400-normal.woff2") format("woff2");
        }

        @font-face {
          font-family: "Portfolio Inter";
          font-style: normal;
          font-weight: 700;
          font-display: block;
          src: url("assets/fonts/inter-latin-700-normal.woff2") format("woff2");
        }

        @font-face {
          font-family: "Portfolio EB Garamond";
          font-style: normal;
          font-weight: 700;
          font-display: block;
          src: url("assets/fonts/eb-garamond-latin-700-normal.woff2") format("woff2");
        }

        @font-face {
          font-family: "Portfolio IBM Plex Mono";
          font-style: normal;
          font-weight: 700;
          font-display: block;
          src: url("assets/fonts/ibm-plex-mono-latin-700-normal.woff2") format("woff2");
        }

        #root {
          position: absolute;
          inset: 0;
          width: 1080px;
          height: 1080px;
          overflow: hidden;
          padding: 92px;
          color: #171512;
          font-family: "Portfolio Inter", sans-serif;
          pointer-events: none;
        }

        .ghost-number {
          position: absolute;
          top: 220px;
          right: 42px;
          width: 330px;
          height: 330px;
          border: 38px solid rgba(23, 21, 18, 0.045);
          border-radius: 50%;
        }

        .headline {
          position: relative;
          z-index: 2;
          width: 820px;
          margin: 42px 0 0;
          font:
            700 82px/0.92 "Portfolio EB Garamond",
            serif;
          letter-spacing: -0.04em;
        }

        .stat-row {
          position: relative;
          z-index: 2;
          display: grid;
          grid-template-columns: 0.8fr 1.2fr;
          gap: 22px;
          margin-top: 42px;
        }

        .stat {
          min-height: 162px;
          padding: 24px 26px;
          border: 3px solid #171512;
          background: #fffcf6;
          box-shadow: 9px 9px 0 rgba(199, 134, 47, 0.45);
        }

        .stat strong {
          display: block;
          font:
            700 66px/0.9 "Portfolio IBM Plex Mono",
            monospace;
          font-variant-numeric: tabular-nums;
          letter-spacing: -0.06em;
        }

        .stat span {
          display: block;
          margin-top: 18px;
          color: #3a352f;
          font:
            700 22px/1 "Portfolio IBM Plex Mono",
            monospace;
          letter-spacing: 0.05em;
          text-transform: uppercase;
        }

        .file-grid {
          position: relative;
          z-index: 3;
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 16px;
          margin-top: 92px;
        }

        .file-card {
          min-height: 170px;
          padding: 24px;
          border: 2px solid #171512;
          background: #f9f9f7;
          box-shadow: 0 12px 26px rgba(23, 21, 18, 0.12);
          transform-origin: center;
        }

        .file-card::before {
          display: block;
          width: 54px;
          height: 14px;
          content: "";
          background: #c7862f;
          box-shadow: 78px 0 0 rgba(23, 21, 18, 0.16);
        }

        .file-card::after {
          display: block;
          width: 82%;
          height: 12px;
          margin-top: 38px;
          content: "";
          background: #171512;
          box-shadow:
            0 30px 0 rgba(23, 21, 18, 0.34),
            0 60px 0 rgba(23, 21, 18, 0.16);
        }

        .file-card code {
          display: block;
          color: #c7862f;
          font:
            700 21px/1.2 "Portfolio IBM Plex Mono",
            monospace;
        }

        .file-card strong {
          display: block;
          margin-top: 12px;
          font:
            700 26px/1.05 "Portfolio Inter",
            sans-serif;
        }

        .file-card small {
          display: block;
          margin-top: 10px;
          color: #696158;
          font:
            700 18px/1 "Portfolio IBM Plex Mono",
            monospace;
        }

        .status-strip {
          position: absolute;
          right: 92px;
          bottom: 52px;
          left: 92px;
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding-top: 14px;
          border-top: 3px solid #171512;
          color: #696158;
          font:
            700 20px/1 "Portfolio IBM Plex Mono",
            monospace;
          letter-spacing: 0.05em;
          text-transform: uppercase;
        }

        .status-strip b {
          color: #171512;
        }
      </style>

      <div
        id="root"
        data-composition-id="scene-02-manual"
        data-width="1080"
        data-height="1080"
        data-duration="6"
      >
        <div class="ghost-number" data-layout-ignore aria-hidden="true"></div>
        <h1 id="scene-02-headline" class="headline" data-text-start="0.28" data-text-duration="0.7">
          One style change meant editing 19 separate videos.
        </h1>

        <div class="file-grid">
          <div class="file-card"></div>
          <div class="file-card"></div>
          <div class="file-card"></div>
          <div class="file-card"></div>
          <div class="file-card"></div>
          <div class="file-card"></div>
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const root = document.querySelector('[data-composition-id="scene-02-manual"]');
        const tl = gsap.timeline({ paused: true });
        const headline = root.querySelector("#scene-02-headline");
        tl.fromTo(
          headline,
          { opacity: 0, y: 40 },
          {
            opacity: 1,
            y: 0,
            duration: Number(headline.dataset.textDuration),
            ease: "power4.out",
          },
          Number(headline.dataset.textStart),
        );
        tl.fromTo(
          root.querySelectorAll(".file-card"),
          { opacity: 0, y: 60, scale: 0.82, rotation: -4 },
          {
            opacity: 1,
            y: 0,
            scale: 1,
            rotation: 0,
            duration: 0.72,
            ease: "power3.out",
            stagger: { each: 0.055, from: "center" },
          },
          1.15,
        );
        window.__timelines["scene-02-manual"] = tl;
      </script>
    </template>
  </body>
</html>
