<!doctype html>
<html lang="en">
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Portfolio Inter";
          font-style: normal;
          font-weight: 400;
          font-display: block;
          src: url("assets/fonts/inter-latin-400-normal.woff2") format("woff2");
        }

        @font-face {
          font-family: "Portfolio Inter";
          font-style: normal;
          font-weight: 700;
          font-display: block;
          src: url("assets/fonts/inter-latin-700-normal.woff2") format("woff2");
        }

        @font-face {
          font-family: "Portfolio EB Garamond";
          font-style: normal;
          font-weight: 700;
          font-display: block;
          src: url("assets/fonts/eb-garamond-latin-700-normal.woff2") format("woff2");
        }

        @font-face {
          font-family: "Portfolio IBM Plex Mono";
          font-style: normal;
          font-weight: 700;
          font-display: block;
          src: url("assets/fonts/ibm-plex-mono-latin-700-normal.woff2") format("woff2");
        }

        #root {
          position: absolute;
          inset: 0;
          width: 1080px;
          height: 1080px;
          overflow: hidden;
          color: #171512;
          font-family: "Portfolio Inter", sans-serif;
          pointer-events: none;
        }

        .stat-row {
          position: absolute;
          top: 126px;
          right: 92px;
          left: 92px;
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 14px;
        }

        .headline {
          position: absolute;
          top: 118px;
          left: 92px;
          width: 820px;
          margin: 0;
          font:
            700 64px/0.94 "Portfolio EB Garamond",
            serif;
          letter-spacing: -0.04em;
        }

        .stat {
          display: flex;
          align-items: baseline;
          justify-content: space-between;
          min-height: 82px;
          padding: 15px 18px;
          border: 3px solid #171512;
          background: #fffcf6;
        }

        .stat strong {
          font:
            700 48px/1 "Portfolio IBM Plex Mono",
            monospace;
          font-variant-numeric: tabular-nums;
          letter-spacing: -0.07em;
        }

        .stat span {
          max-width: 92px;
          color: #3a352f;
          font:
            700 16px/1.05 "Portfolio IBM Plex Mono",
            monospace;
          letter-spacing: 0.03em;
          text-transform: uppercase;
        }

        .proof-frame {
          position: absolute;
          top: 220px;
          left: 74px;
          width: 932px;
          height: 540px;
          border: 4px solid #171512;
          border-radius: 24px;
          box-shadow: 0 28px 70px rgba(23, 21, 18, 0.14);
        }

        .proof-frame::before,
        .proof-frame::after {
          position: absolute;
          width: 34px;
          height: 34px;
          content: "";
          border-color: #0066ff;
        }

        .proof-frame::before {
          top: -14px;
          left: -14px;
          border-top: 5px solid #0066ff;
          border-left: 5px solid #0066ff;
        }

        .proof-frame::after {
          right: -14px;
          bottom: -14px;
          border-right: 5px solid #0066ff;
          border-bottom: 5px solid #0066ff;
        }

        .labels {
          position: absolute;
          top: 796px;
          right: 92px;
          left: 92px;
          min-height: 100px;
        }

        .label-phase {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: space-between;
          opacity: 0;
        }

        .label-phase strong {
          max-width: 660px;
          font:
            700 54px/0.94 "Portfolio EB Garamond",
            serif;
          letter-spacing: -0.03em;
        }

        .family-chip {
          padding: 14px 16px;
          color: #fffcf6;
          background: #171512;
          font:
            700 18px/1 "Portfolio IBM Plex Mono",
            monospace;
          letter-spacing: 0.04em;
          text-transform: uppercase;
        }

        .progress-shell {
          position: absolute;
          right: 92px;
          bottom: 96px;
          left: 92px;
          height: 18px;
          border: 3px solid #171512;
          background: #fffcf6;
        }

        .progress-fill {
          display: block;
          width: 100%;
          height: 100%;
          background: #0066ff;
          transform-origin: left center;
        }

        .progress-meta {
          position: absolute;
          right: 92px;
          bottom: 48px;
          left: 92px;
          display: flex;
          justify-content: space-between;
          color: #696158;
          font:
            700 18px/1 "Portfolio IBM Plex Mono",
            monospace;
          letter-spacing: 0.04em;
          text-transform: uppercase;
        }
      </style>

      <div
        id="root"
        data-composition-id="scene-05-proof"
        data-width="1080"
        data-height="1080"
        data-duration="11"
      >
        <h1
          id="scene-05-headline"
          class="headline"
          data-text-start="0.18"
          data-text-duration="0.58"
        >
          Six projects. One shared system.
        </h1>

        <div id="scene-05-frame" class="proof-frame"></div>

        <div class="progress-shell"><span id="scene-05-progress" class="progress-fill"></span></div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const root = document.querySelector('[data-composition-id="scene-05-proof"]');
        const tl = gsap.timeline({ paused: true });
        const headline = root.querySelector("#scene-05-headline");
        tl.fromTo(
          headline,
          { opacity: 0, y: 24 },
          {
            opacity: 1,
            y: 0,
            duration: Number(headline.dataset.textDuration),
            ease: "power4.out",
          },
          Number(headline.dataset.textStart),
        );
        tl.fromTo(
          root.querySelector("#scene-05-frame"),
          { opacity: 0, scale: 0.96 },
          { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" },
          0.26,
        );
        tl.fromTo(
          root.querySelector("#scene-05-progress"),
          { scaleX: 0 },
          { scaleX: 1, duration: 11, ease: "none" },
          0,
        );

        window.__timelines["scene-05-proof"] = tl;
      </script>
    </template>
  </body>
</html>
