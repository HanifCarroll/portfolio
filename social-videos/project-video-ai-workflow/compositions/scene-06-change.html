<!doctype html>
<html lang="en">
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Portfolio Inter";
          font-style: normal;
          font-weight: 400;
          font-display: block;
          src: url("assets/fonts/inter-latin-400-normal.woff2") format("woff2");
        }

        @font-face {
          font-family: "Portfolio Inter";
          font-style: normal;
          font-weight: 700;
          font-display: block;
          src: url("assets/fonts/inter-latin-700-normal.woff2") format("woff2");
        }

        @font-face {
          font-family: "Portfolio EB Garamond";
          font-style: normal;
          font-weight: 700;
          font-display: block;
          src: url("assets/fonts/eb-garamond-latin-700-normal.woff2") format("woff2");
        }

        @font-face {
          font-family: "Portfolio IBM Plex Mono";
          font-style: normal;
          font-weight: 700;
          font-display: block;
          src: url("assets/fonts/ibm-plex-mono-latin-700-normal.woff2") format("woff2");
        }

        #root {
          position: absolute;
          inset: 0;
          width: 1080px;
          height: 1080px;
          overflow: hidden;
          padding: 92px;
          color: #171512;
          font-family: "Portfolio Inter", sans-serif;
          pointer-events: none;
        }

        .headline {
          width: 850px;
          margin: 34px 0 0;
          font:
            700 84px/0.9 "Portfolio EB Garamond",
            serif;
          letter-spacing: -0.045em;
        }

        .control-rail {
          display: flex;
          align-items: center;
          justify-content: space-between;
          margin-top: 38px;
          padding: 18px 22px;
          border: 3px solid #171512;
          background: #fffcf6;
        }

        .controls {
          display: flex;
          gap: 12px;
        }

        .control {
          position: relative;
          width: 92px;
          height: 42px;
          padding: 12px 14px;
          border: 2px solid #171512;
          color: #3a352f;
          font:
            700 18px/1 "Portfolio IBM Plex Mono",
            monospace;
          text-transform: uppercase;
        }

        .control::after {
          position: absolute;
          top: 17px;
          left: 14px;
          width: 58px;
          height: 7px;
          content: "";
          background: #171512;
        }

        .switch {
          position: relative;
          display: grid;
          grid-template-columns: 1fr 1fr;
          width: 250px;
          height: 58px;
          border: 3px solid #171512;
          background: #f9f9f7;
        }

        .switch span {
          z-index: 2;
          display: grid;
          place-items: center;
          font:
            700 18px/1 "Portfolio IBM Plex Mono",
            monospace;
        }

        .switch-knob {
          position: absolute;
          top: 0;
          left: 0;
          width: 122px;
          height: 52px;
          background: #0066ff;
        }

        .proof-row {
          position: relative;
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 24px;
          margin-top: 48px;
        }

        .proof-card {
          position: relative;
          padding: 14px;
          border: 3px solid #171512;
          background: #fffcf6;
          box-shadow: 0 16px 32px rgba(23, 21, 18, 0.14);
        }

        .proof-card img {
          display: block;
          width: 100%;
          height: 154px;
          object-fit: contain;
          background: #171512;
        }

        .proof-visual {
          display: block;
          width: 100%;
          height: 210px;
          border: 2px solid #171512;
          background:
            linear-gradient(90deg, #0066ff 0 36%, transparent 36%) 22px 24px / calc(100% - 44px)
              14px no-repeat,
            linear-gradient(90deg, #171512 0 72%, transparent 72%) 22px 72px / calc(100% - 44px)
              12px no-repeat,
            linear-gradient(90deg, #696158 0 52%, transparent 52%) 22px 112px / calc(100% - 44px)
              10px no-repeat,
            #f9f9f7;
        }

        .proof-card:nth-child(2) .proof-visual {
          background:
            linear-gradient(90deg, #1d6f58 0 48%, transparent 48%) 22px 24px / calc(100% - 44px)
              14px no-repeat,
            linear-gradient(90deg, #171512 0 62%, transparent 62%) 22px 72px / calc(100% - 44px)
              12px no-repeat,
            linear-gradient(90deg, #696158 0 78%, transparent 78%) 22px 112px / calc(100% - 44px)
              10px no-repeat,
            #f9f9f7;
        }

        .proof-card:nth-child(3) .proof-visual {
          background:
            linear-gradient(90deg, #c7862f 0 30%, transparent 30%) 22px 24px / calc(100% - 44px)
              14px no-repeat,
            linear-gradient(90deg, #171512 0 84%, transparent 84%) 22px 72px / calc(100% - 44px)
              12px no-repeat,
            linear-gradient(90deg, #696158 0 58%, transparent 58%) 22px 112px / calc(100% - 44px)
              10px no-repeat,
            #f9f9f7;
        }

        .proof-card strong {
          display: block;
          margin-top: 16px;
          font:
            700 28px/1 "Portfolio EB Garamond",
            serif;
        }

        .proof-card small {
          display: block;
          margin-top: 9px;
          color: #696158;
          font:
            700 16px/1 "Portfolio IBM Plex Mono",
            monospace;
          text-transform: uppercase;
        }

        .sync-outline {
          position: absolute;
          inset: -9px;
          border: 5px solid #0066ff;
          opacity: 0;
        }

        .system-path {
          position: absolute;
          right: 0;
          bottom: -36px;
          left: 0;
          height: 8px;
          background: #0066ff;
          transform-origin: left center;
        }

        .result {
          display: flex;
          justify-content: space-between;
          margin-top: 64px;
          color: #3a352f;
          font:
            700 22px/1.2 "Portfolio IBM Plex Mono",
            monospace;
          text-transform: uppercase;
        }

        .result b {
          color: #1d6f58;
        }
      </style>

      <div
        id="root"
        data-composition-id="scene-06-change"
        data-width="1080"
        data-height="1080"
        data-duration="5"
      >
        <h1
          id="scene-06-headline"
          class="headline"
          data-text-start="0.22"
          data-text-duration="0.58"
        >
          Change one shared file. Every video updates.
        </h1>

        <div id="scene-06-controls" class="control-rail">
          <div class="controls">
            <span class="control"></span>
            <span class="control"></span>
            <span class="control"></span>
          </div>
          <div class="switch">
            <div id="scene-06-knob" class="switch-knob"></div>
          </div>
        </div>

        <div class="proof-row">
          <article class="proof-card">
            <span class="proof-visual"></span>
            <div class="sync-outline"></div>
          </article>
          <article class="proof-card">
            <span class="proof-visual"></span>
            <div class="sync-outline"></div>
          </article>
          <article class="proof-card">
            <span class="proof-visual"></span>
            <div class="sync-outline"></div>
          </article>
          <div id="scene-06-path" class="system-path"></div>
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const root = document.querySelector('[data-composition-id="scene-06-change"]');
        const tl = gsap.timeline({ paused: true });
        const headline = root.querySelector("#scene-06-headline");

        tl.fromTo(
          headline,
          { opacity: 0, y: 34 },
          {
            opacity: 1,
            y: 0,
            duration: Number(headline.dataset.textDuration),
            ease: "power4.out",
          },
          Number(headline.dataset.textStart),
        );
        tl.fromTo(
          root.querySelector("#scene-06-controls"),
          { opacity: 0, scale: 0.94 },
          { opacity: 1, scale: 1, duration: 0.44, ease: "power3.out" },
          0.48,
        );
        tl.fromTo(
          root.querySelectorAll(".proof-card"),
          { opacity: 0, y: 56, scale: 0.9 },
          { opacity: 1, y: 0, scale: 1, duration: 0.58, ease: "power3.out", stagger: 0.08 },
          0.7,
        );
        tl.fromTo(
          root.querySelector("#scene-06-knob"),
          { x: 0 },
          { x: 122, duration: 0.48, ease: "power4.inOut" },
          1.24,
        );
        tl.fromTo(
          root.querySelector("#scene-06-path"),
          { scaleX: 0 },
          { scaleX: 1, duration: 0.66, ease: "power3.out" },
          1.42,
        );
        tl.fromTo(
          root.querySelectorAll(".sync-outline"),
          { opacity: 0, scale: 0.96 },
          { opacity: 1, scale: 1, duration: 0.38, ease: "power4.out", stagger: 0.06 },
          1.64,
        );
        window.__timelines["scene-06-change"] = tl;
      </script>
    </template>
  </body>
</html>
