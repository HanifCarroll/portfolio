<!doctype html>
<html lang="en">
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: 1080px;
          height: 1080px;
          overflow: hidden;
          padding: 92px;
          color: #171512;
          font-family: "Inter", sans-serif;
          pointer-events: none;
        }

        .ghost-word {
          position: absolute;
          right: 92px;
          bottom: 110px;
          color: rgba(23, 21, 18, 0.055);
          font:
            700 220px/0.8 "IBM Plex Mono",
            monospace;
          letter-spacing: -0.12em;
        }

        .ghost-word::before {
          content: "NEXT";
        }

        .topline {
          display: flex;
          justify-content: space-between;
          color: #696158;
          font:
            700 22px/1 "IBM Plex Mono",
            monospace;
          letter-spacing: 0.07em;
          text-transform: uppercase;
        }

        .statement {
          position: relative;
          z-index: 2;
          margin: 180px 0 0;
          font:
            700 104px/0.94 "EB Garamond",
            serif;
          letter-spacing: -0.05em;
        }

        .statement span {
          display: block;
        }

        .statement span:last-child {
          color: #0066ff;
        }

        .workflow-rail {
          position: relative;
          z-index: 2;
          display: grid;
          grid-template-columns: auto 1fr auto 1fr auto;
          align-items: center;
          gap: 18px;
          margin-top: 82px;
          color: #3a352f;
          font:
            700 21px/1 "IBM Plex Mono",
            monospace;
          text-transform: uppercase;
        }

        .workflow-rail i {
          display: block;
          width: 100%;
          height: 5px;
          background: #0066ff;
          transform-origin: left center;
        }

        .verified {
          display: inline-flex;
          align-items: center;
          gap: 12px;
          margin-top: 54px;
          padding: 16px 20px;
          color: #fffcf6;
          background: #1d6f58;
          font:
            700 21px/1 "IBM Plex Mono",
            monospace;
          text-transform: uppercase;
        }

        .verified::before {
          width: 15px;
          height: 15px;
          content: "";
          background: #fffcf6;
          border-radius: 50%;
        }

        .footer {
          position: absolute;
          right: 92px;
          bottom: 64px;
          left: 92px;
          display: flex;
          justify-content: space-between;
          padding-top: 16px;
          border-top: 3px solid #171512;
          color: #696158;
          font:
            700 19px/1 "IBM Plex Mono",
            monospace;
          text-transform: uppercase;
        }

        .footer b {
          color: #171512;
        }

      <div

          <span>Judgment</span><i></i><span>System</span><i></i><span>Result</span>

        <div id="scene-07-verified" class="verified">Documented + repeatable</div>
        <div id="scene-07-footer" class="footer">
          <span>AI judgment + deterministic software</span><b>hanifcarroll.com</b>
        </div>

      <script>
        window.__timelines = window.__timelines || {};
        const root = document.querySelector('[data-composition-id="scene-07-close"]');
        const tl = gsap.timeline({ paused: true });

        tl.fromTo(
          root.querySelector("#scene-07-topline"),
          { opacity: 0, x: -34 },
          { opacity: 1, x: 0, duration: 0.34, ease: "power3.out" },
          0.1,

        tl.fromTo(

          { scaleX: 1, duration: 0.46, ease: "power3.out", stagger: 0.08 },
          0.38,
        );
        tl.fromTo(
          root.querySelector("#scene-07-rail"),
          { opacity: 0 },
          { opacity: 1, duration: 0.34, ease: "power2.out" },

          root.querySelector("#scene-07-footer"),
          { opacity: 0, y: 18 },
          { opacity: 1, y: 0, duration: 0.36, ease: "power3.out" },
          0.62,
        );

        window.__timelines["scene-07-close"] = tl;
      </script>
    </template>
  </body>
</html>
