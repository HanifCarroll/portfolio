<!doctype html>
<html lang="en">
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Portfolio Inter";
          font-style: normal;
          font-weight: 400;
          font-display: block;
          src: url("assets/fonts/inter-latin-400-normal.woff2") format("woff2");
        }

        @font-face {
          font-family: "Portfolio Inter";
          font-style: normal;
          font-weight: 700;
          font-display: block;
          src: url("assets/fonts/inter-latin-700-normal.woff2") format("woff2");
        }

        @font-face {
          font-family: "Portfolio EB Garamond";
          font-style: normal;
          font-weight: 700;
          font-display: block;
          src: url("assets/fonts/eb-garamond-latin-700-normal.woff2") format("woff2");
        }

        @font-face {
          font-family: "Portfolio IBM Plex Mono";
          font-style: normal;
          font-weight: 700;
          font-display: block;
          src: url("assets/fonts/ibm-plex-mono-latin-700-normal.woff2") format("woff2");
        }

        #root {
          position: absolute;
          inset: 0;
          width: 1080px;
          height: 1080px;
          overflow: hidden;
          padding: 92px;
          color: #171512;
          font-family: "Portfolio Inter", sans-serif;
          pointer-events: none;
        }

        .ghost-word {
          position: absolute;
          right: 92px;
          bottom: 110px;
          color: rgba(23, 21, 18, 0.055);
          font:
            700 220px/0.8 "Portfolio IBM Plex Mono",
            monospace;
          letter-spacing: -0.12em;
        }

        .ghost-word::before {
          content: "";
        }

        .statement {
          position: relative;
          z-index: 2;
          margin: 180px 0 0;
          font:
            700 104px/1.02 "Portfolio EB Garamond",
            serif;
          letter-spacing: -0.05em;
        }

        .statement span {
          display: block;
        }

        .statement span + span {
          margin-top: 18px;
        }

        .statement span:last-child {
          color: #0066ff;
        }

        .workflow-rail {
          position: relative;
          z-index: 2;
          display: grid;
          grid-template-columns: auto 1fr auto 1fr auto;
          align-items: center;
          gap: 18px;
          margin-top: 82px;
          color: #3a352f;
          font:
            700 21px/1 "Portfolio IBM Plex Mono",
            monospace;
          text-transform: uppercase;
        }

        .workflow-rail i {
          display: block;
          width: 100%;
          height: 5px;
          background: #0066ff;
          transform-origin: left center;
        }

        .verified {
          display: inline-flex;
          align-items: center;
          gap: 12px;
          margin-top: 54px;
          padding: 16px 20px;
          color: #fffcf6;
          background: #1d6f58;
          font:
            700 21px/1 "Portfolio IBM Plex Mono",
            monospace;
          text-transform: uppercase;
        }

        .verified::before {
          width: 15px;
          height: 15px;
          content: "";
          background: #fffcf6;
          border-radius: 50%;
        }

        .footer {
          position: absolute;
          right: 92px;
          bottom: 92px;
          left: 92px;
          display: flex;
          justify-content: space-between;
          padding-top: 16px;
          border-top: 3px solid #171512;
          color: #696158;
          font:
            700 19px/1 "Portfolio IBM Plex Mono",
            monospace;
          text-transform: uppercase;
        }

        .footer b {
          color: #171512;
        }
      </style>

      <div
        id="root"
        data-composition-id="scene-07-close"
        data-width="1080"
        data-height="1080"
        data-duration="5"
      >
        <div class="ghost-word" data-layout-ignore aria-hidden="true"></div>
        <h1
          id="scene-07-statement"
          class="statement"
          data-text-start="0.14"
          data-text-duration="0.52"
        >
          <span>AI judgment.</span>
          <span>Reliable tools. Practical results.</span>
        </h1>
        <div id="scene-07-footer" class="footer" data-text-start="0.62" data-text-duration="0.36">
          <b>hanifcarroll.com</b>
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const root = document.querySelector('[data-composition-id="scene-07-close"]');
        const tl = gsap.timeline({ paused: true });
        const statement = root.querySelector("#scene-07-statement");
        const footer = root.querySelector("#scene-07-footer");

        tl.fromTo(
          statement,
          { opacity: 0, y: 46, scale: 0.97 },
          {
            opacity: 1,
            y: 0,
            scale: 1,
            duration: Number(statement.dataset.textDuration),
            ease: "power4.out",
          },
          Number(statement.dataset.textStart),
        );
        tl.fromTo(
          footer,
          { opacity: 0, y: 18 },
          {
            opacity: 1,
            y: 0,
            duration: Number(footer.dataset.textDuration),
            ease: "power3.out",
          },
          Number(footer.dataset.textStart),
        );

        window.__timelines["scene-07-close"] = tl;
      </script>
    </template>
  </body>
</html>
