<!doctype html>
<html lang="en" data-resolution="square">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <title>Project Video AI Workflow</title>
    <script src="./assets/runtime/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Portfolio Inter";
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url("./assets/fonts/inter-latin-400-normal.woff2") format("woff2");
      }

      @font-face {
        font-family: "Portfolio Inter";
        font-style: normal;
        font-weight: 700;
        font-display: block;
        src: url("./assets/fonts/inter-latin-700-normal.woff2") format("woff2");
      }

      @font-face {
        font-family: "Portfolio EB Garamond";
        font-style: normal;
        font-weight: 700;
        font-display: block;
        src: url("./assets/fonts/eb-garamond-latin-700-normal.woff2") format("woff2");
      }

      @font-face {
        font-family: "Portfolio IBM Plex Mono";
        font-style: normal;
        font-weight: 700;
        font-display: block;
        src: url("./assets/fonts/ibm-plex-mono-latin-700-normal.woff2") format("woff2");
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: #f9f9f7;
      }

      body {
        color: #171512;
        font-family: "Portfolio Inter", sans-serif;
      }

      #root {
        position: relative;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
      }

      #background {
        position: absolute;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        background-color: #f9f9f7;
      }

      #background-grid {
        position: absolute;
        inset: -32px;
        background-image:
          linear-gradient(rgba(23, 21, 18, 0.055) 2px, rgba(23, 21, 18, 0) 2px),
          linear-gradient(90deg, rgba(23, 21, 18, 0.055) 2px, rgba(23, 21, 18, 0) 2px);
        background-size: 54px 54px;
      }

      #background::before,
      #background::after {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 28px;
        content: "";
        background-color: rgba(23, 21, 18, 0.035);
        border-right: 2px solid rgba(23, 21, 18, 0.08);
        border-left: 2px solid rgba(23, 21, 18, 0.08);
      }

      #background::before {
        left: 26px;
      }

      #background::after {
        right: 26px;
      }

      .scene-host {
        position: absolute;
        inset: 0;
        z-index: 20;
      }

      #font-contract-probe {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        opacity: 0;
        pointer-events: none;
      }

      #font-contract-probe .inter-400 {
        font: 400 16px/1 "Portfolio Inter";
      }

      #font-contract-probe .inter-700 {
        font: 700 16px/1 "Portfolio Inter";
      }

      #font-contract-probe .garamond-700 {
        font: 700 16px/1 "Portfolio EB Garamond";
      }

      #font-contract-probe .plex-700 {
        font: 700 16px/1 "Portfolio IBM Plex Mono";
      }

      .proof-video {
        position: absolute;
        top: 238px;
        left: 92px;
        z-index: 10;
        width: 896px;
        height: 504px;
        object-fit: contain;
        background-color: #171512;
        border: 3px solid #171512;
        border-radius: 18px;
        box-shadow: 0 26px 70px rgba(23, 21, 18, 0.22);
        transform-origin: center center;
      }

      .transition {
        position: absolute;
        inset: 0;
        z-index: 50;
        overflow: hidden;
        pointer-events: none;
      }

      .wipe-block {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1080px;
        will-change: transform;
      }

      .wipe-blue {
        background-color: #0066ff;
      }

      .wipe-paper {
        background-color: #fffcf6;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="project-video-ai-workflow"
      data-start="0"
      data-width="1080"
      data-height="1080"
      data-duration="45.5"
      data-fps="30"
    >
      <div id="background" class="clip" data-start="0" data-duration="45.5" data-track-index="0">
        <div id="background-grid" data-layout-ignore></div>
      </div>

      <div id="font-contract-probe" data-layout-ignore aria-hidden="true">
        <span class="inter-400">Ag</span>
        <span class="inter-700">Ag</span>
        <span class="garamond-700">Ag</span>
        <span class="plex-700">Ag</span>
      </div>

      <div
        id="el-scene-01-hook"
        class="clip scene-host"
        data-composition-id="scene-01-hook"
        data-composition-src="compositions/scene-01-hook.html"
        data-start="0"
        data-duration="4"
        data-track-index="1"
        data-width="1080"
        data-height="1080"
      ></div>
      <div
        id="el-scene-02-manual"
        class="clip scene-host"
        data-composition-id="scene-02-manual"
        data-composition-src="compositions/scene-02-manual.html"
        data-start="4"
        data-duration="6"
        data-track-index="1"
        data-width="1080"
        data-height="1080"
      ></div>
      <div
        id="el-scene-03-system"
        class="clip scene-host"
        data-composition-id="scene-03-system"
        data-composition-src="compositions/scene-03-system.html"
        data-start="10"
        data-duration="6.5"
        data-track-index="1"
        data-width="1080"
        data-height="1080"
      ></div>
      <div
        id="el-scene-04-split"
        class="clip scene-host"
        data-composition-id="scene-04-split"
        data-composition-src="compositions/scene-04-split.html"
        data-start="16.5"
        data-duration="8"
        data-track-index="1"
        data-width="1080"
        data-height="1080"
      ></div>
      <div
        id="el-scene-05-proof"
        class="clip scene-host"
        data-composition-id="scene-05-proof"
        data-composition-src="compositions/scene-05-proof.html"
        data-start="24.5"
        data-duration="11"
        data-track-index="1"
        data-width="1080"
        data-height="1080"
      ></div>
      <div
        id="el-scene-06-change"
        class="clip scene-host"
        data-composition-id="scene-06-change"
        data-composition-src="compositions/scene-06-change.html"
        data-start="35.5"
        data-duration="5"
        data-track-index="1"
        data-width="1080"
        data-height="1080"
      ></div>
      <div
        id="el-scene-07-close"
        class="clip scene-host"
        data-composition-id="scene-07-close"
        data-composition-src="compositions/scene-07-close.html"
        data-start="40.5"
        data-duration="5"
        data-track-index="1"
        data-width="1080"
        data-height="1080"
      ></div>

      <video
        id="proof-agent-recall"
        class="clip proof-video"
        src="assets/clips/agent-recall.mp4"
        data-start="24.5"
        data-duration="1.833"
        data-track-index="2"
        muted
        playsinline
      ></video>
      <video
        id="proof-health-ai-search-audit"
        class="clip proof-video"
        src="assets/clips/health-ai-search-audit.mp4"
        data-start="26.333"
        data-duration="1.833"
        data-track-index="2"
        muted
        playsinline
      ></video>
      <video
        id="proof-palabruno"
        class="clip proof-video"
        src="assets/clips/palabruno.mp4"
        data-start="28.166"
        data-duration="1.833"
        data-track-index="2"
        muted
        playsinline
      ></video>
      <video
        id="proof-casamo"
        class="clip proof-video"
        src="assets/clips/casamo.mp4"
        data-start="29.999"
        data-duration="1.833"
        data-track-index="2"
        muted
        playsinline
      ></video>
      <video
        id="proof-maximo-interiorismo"
        class="clip proof-video"
        src="assets/clips/maximo-interiorismo.mp4"
        data-start="31.832"
        data-duration="1.833"
        data-track-index="2"
        muted
        playsinline
      ></video>
      <video
        id="proof-redwriter-comics"
        class="clip proof-video"
        src="assets/clips/redwriter-comics.mp4"
        data-start="33.665"
        data-duration="1.835"
        data-track-index="2"
        muted
        playsinline
      ></video>

      <div
        id="transition-01"
        class="clip transition"
        data-start="3.62"
        data-duration="0.78"
        data-track-index="3"
      >
        <div id="transition-01-a" class="wipe-block wipe-blue" data-layout-allow-overflow></div>
        <div id="transition-01-b" class="wipe-block wipe-paper" data-layout-allow-overflow></div>
      </div>
      <div
        id="transition-02"
        class="clip transition"
        data-start="9.68"
        data-duration="0.72"
        data-track-index="4"
      >
        <div id="transition-02-a" class="wipe-block wipe-blue" data-layout-allow-overflow></div>
        <div id="transition-02-b" class="wipe-block wipe-paper" data-layout-allow-overflow></div>
      </div>
      <div
        id="transition-03"
        class="clip transition"
        data-start="16.18"
        data-duration="0.72"
        data-track-index="5"
      >
        <div id="transition-03-a" class="wipe-block wipe-blue" data-layout-allow-overflow></div>
        <div id="transition-03-b" class="wipe-block wipe-paper" data-layout-allow-overflow></div>
      </div>
      <div
        id="transition-04"
        class="clip transition"
        data-start="24.18"
        data-duration="0.72"
        data-track-index="6"
      >
        <div id="transition-04-a" class="wipe-block wipe-blue" data-layout-allow-overflow></div>
        <div id="transition-04-b" class="wipe-block wipe-paper" data-layout-allow-overflow></div>
      </div>
      <div
        id="transition-05"
        class="clip transition"
        data-start="35.18"
        data-duration="0.72"
        data-track-index="7"
      >
        <div id="transition-05-a" class="wipe-block wipe-blue" data-layout-allow-overflow></div>
        <div id="transition-05-b" class="wipe-block wipe-paper" data-layout-allow-overflow></div>
      </div>
      <div
        id="transition-06"
        class="clip transition"
        data-start="40.18"
        data-duration="0.72"
        data-track-index="8"
      >
        <div id="transition-06-a" class="wipe-block wipe-blue" data-layout-allow-overflow></div>
        <div id="transition-06-b" class="wipe-block wipe-paper" data-layout-allow-overflow></div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.fromTo(
        "#background-grid",
        { x: 0, y: 0 },
        { x: -12, y: 8, duration: 45.5, ease: "none" },
        0,
      );

      const proofClips = [
        ["#proof-agent-recall", 24.5],
        ["#proof-health-ai-search-audit", 26.333],
        ["#proof-palabruno", 28.166],
        ["#proof-casamo", 29.999],
        ["#proof-maximo-interiorismo", 31.832],
        ["#proof-redwriter-comics", 33.665],
      ];

      proofClips.forEach(([selector, start]) => {
        tl.fromTo(
          selector,
          { opacity: 0, scale: 1.025 },
          { opacity: 1, scale: 1, duration: 0.28, ease: "power3.out" },
          start,
        );
      });

      function addCoverWipe(prefix, start, boundary) {
        tl.fromTo(`#${prefix}-a`, { x: -1080 }, { x: 0, duration: 0.24, ease: "power3.in" }, start);
        tl.fromTo(
          `#${prefix}-b`,
          { x: -1080 },
          { x: 0, duration: 0.24, ease: "power3.in" },
          start + 0.06,
        );
        tl.to(`#${prefix}-a`, { x: 1080, duration: 0.24, ease: "power3.out" }, boundary + 0.02);
        tl.to(`#${prefix}-b`, { x: 1080, duration: 0.24, ease: "power3.out" }, boundary + 0.08);
      }

      addCoverWipe("transition-01", 3.62, 4);
      addCoverWipe("transition-02", 9.68, 10);
      addCoverWipe("transition-03", 16.18, 16.5);
      addCoverWipe("transition-04", 24.18, 24.5);
      addCoverWipe("transition-05", 35.18, 35.5);
      addCoverWipe("transition-06", 40.18, 40.5);

      window.__timelines["project-video-ai-workflow"] = tl;
    </script>
  </body>
</html>
