<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1260" role="img" aria-labelledby="title desc">
  <title id="title">One continuous path from conversation through handoff</title>
  <desc id="desc">Four stacked paper artifacts show listening, deciding, building, and handing off.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="11" flood-color="#10253f" flood-opacity=".15"/>
    </filter>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0v22" fill="none" stroke="#d6e4ec" stroke-width="1"/>
    </pattern>
  </defs>

  <path d="M360 108v1040" fill="none" stroke="#ffd84f" stroke-width="7" stroke-linecap="round"/>
  <path d="m342 1132 18 20 18-20" fill="none" stroke="#ffd84f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="Inter,Arial,sans-serif" fill="#10253f" font-weight="800">
    <g transform="translate(74 62)"><circle cx="0" cy="0" r="9" fill="#ffd84f"/><text x="20" y="-5" font-size="21">01</text><text x="20" y="22" font-size="16" letter-spacing="3">LISTEN</text></g>
    <g transform="translate(74 348)"><circle cx="0" cy="0" r="9" fill="#ffd84f"/><text x="20" y="-5" font-size="21">02</text><text x="20" y="22" font-size="16" letter-spacing="3">DECIDE</text></g>
    <g transform="translate(74 634)"><circle cx="0" cy="0" r="9" fill="#ffd84f"/><text x="20" y="-5" font-size="21">03</text><text x="20" y="22" font-size="16" letter-spacing="3">BUILD</text></g>
    <g transform="translate(74 920)"><circle cx="0" cy="0" r="9" fill="#ffd84f"/><text x="20" y="-5" font-size="21">04</text><text x="20" y="22" font-size="16" letter-spacing="3">HAND OFF</text></g>
  </g>

  <g filter="url(#shadow)">
    <g transform="translate(180 72) rotate(-2 230 105)">
      <rect x="9" y="10" width="460" height="214" rx="12" fill="#e8e1d2"/>
      <rect width="460" height="214" rx="12" fill="#faf7ed"/>
      <rect x="183" y="-13" width="94" height="28" rx="4" fill="#10253f"/>
      <text x="28" y="43" fill="#10253f" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800">FOUNDER CONVERSATION</text>
      <text x="28" y="86" fill="#10253f" font-family="Georgia,serif" font-size="20" font-style="italic">What is getting harder to run?</text>
      <path d="M28 111h346M28 139h286" stroke="#bdb7aa" stroke-width="8" stroke-linecap="round"/>
      <rect x="28" y="164" width="206" height="31" rx="7" fill="#fff0a8"/>
      <text x="46" y="185" fill="#10253f" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800">CONTEXT CAPTURED</text>
    </g>

    <g transform="translate(180 358) rotate(2 230 105)">
      <rect x="9" y="10" width="460" height="214" rx="12" fill="#e8e1d2"/>
      <rect width="460" height="214" rx="12" fill="#faf7ed"/>
      <text x="28" y="43" fill="#10253f" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800">DECISION RECORD</text>
      <text x="28" y="90" fill="#10253f" font-family="Georgia,serif" font-size="20" font-style="italic">Approach</text>
      <path d="M130 84h224M130 113h178" stroke="#bdb7aa" stroke-width="8" stroke-linecap="round"/>
      <text x="28" y="160" fill="#10253f" font-family="Georgia,serif" font-size="20" font-style="italic">Tradeoffs</text>
      <path d="M130 154h248M130 183h194" stroke="#bdb7aa" stroke-width="8" stroke-linecap="round"/>
      <path d="m385 45 18 18 32-37" fill="none" stroke="#ffd84f" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="translate(180 644) rotate(-1 230 105)">
      <rect x="9" y="10" width="460" height="214" rx="12" fill="#e8e1d2"/>
      <rect width="460" height="214" rx="12" fill="#faf7ed"/>
      <rect width="460" height="214" rx="12" fill="url(#grid)" opacity=".72"/>
      <text x="28" y="43" fill="#10253f" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800">FOCUSED BUILD</text>
      <g fill="#faf7ed" stroke="#10253f" stroke-width="3" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle">
        <rect x="34" y="78" width="104" height="46" rx="6"/><text x="86" y="106" fill="#10253f" stroke="none">INTAKE</text>
        <rect x="178" y="78" width="104" height="46" rx="6"/><text x="230" y="106" fill="#10253f" stroke="none">VALIDATE</text>
        <rect x="322" y="78" width="104" height="46" rx="6"/><text x="374" y="106" fill="#10253f" stroke="none">DELIVER</text>
        <path d="M138 101h40M282 101h40" fill="none"/>
      </g>
      <circle cx="36" cy="169" r="10" fill="#ffd84f"/><text x="58" y="175" fill="#10253f" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800">SYSTEM READY</text>
    </g>

    <g transform="translate(180 930) rotate(2 230 105)">
      <rect x="9" y="10" width="460" height="214" rx="12" fill="#e8e1d2"/>
      <rect width="460" height="214" rx="12" fill="#faf7ed"/>
      <text x="28" y="43" fill="#10253f" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800">HANDOFF</text>
      <g fill="#10253f" font-family="Inter,Arial,sans-serif" font-size="16"><text x="64" y="84">Documentation</text><text x="64" y="120">System access</text><text x="64" y="156">Runbook</text><text x="64" y="192">Next priorities</text></g>
      <g fill="none" stroke="#10253f" stroke-width="3"><rect x="28" y="65" width="21" height="21" rx="3"/><rect x="28" y="101" width="21" height="21" rx="3"/><rect x="28" y="137" width="21" height="21" rx="3"/><rect x="28" y="173" width="21" height="21" rx="3"/></g>
      <g fill="none" stroke="#ffd84f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="m31 74 7 7 14-17"/><path d="m31 110 7 7 14-17"/><path d="m31 146 7 7 14-17"/><path d="m31 182 7 7 14-17"/></g>
      <circle cx="402" cy="166" r="28" fill="#10253f"/><text x="402" y="174" text-anchor="middle" fill="#ffd84f" font-family="Georgia,serif" font-size="22" font-weight="700">HC</text>
    </g>
  </g>
</svg>
