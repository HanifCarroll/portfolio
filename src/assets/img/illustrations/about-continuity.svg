<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">One continuous path from conversation through handoff</title>
  <desc id="desc">Four tactile paper artifacts show a founder conversation becoming a decision record, a focused build plan, and a complete handoff.</desc>
  <defs>
    <filter id="paperShadow" x="-25%" y="-25%" width="150%" height="165%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#10253f" flood-opacity=".16"/>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0v24" fill="none" stroke="#d6e4ec" stroke-width="1"/>
    </pattern>
  </defs>

  <path d="M54 575C164 665 249 546 322 468s178-91 249-16 120 100 200 35 64-252 191-274 158 178 278 168 202-28 304 64" fill="none" stroke="#ffd84f" stroke-width="8" stroke-linecap="round"/>
  <path d="m1522 421 26 25-35 14" fill="none" stroke="#ffd84f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="Inter,Arial,sans-serif" fill="#10253f">
    <g transform="translate(54 520)"><circle cx="0" cy="0" r="10" fill="#ffd84f"/><text x="22" y="-7" font-size="22" font-weight="800">01</text><text x="22" y="20" font-size="18" font-weight="800" letter-spacing="3">LISTEN</text></g>
    <g transform="translate(454 373)"><circle cx="0" cy="0" r="10" fill="#ffd84f"/><text x="22" y="-7" font-size="22" font-weight="800">02</text><text x="22" y="20" font-size="18" font-weight="800" letter-spacing="3">DECIDE</text></g>
    <g transform="translate(895 95)"><circle cx="0" cy="0" r="10" fill="#ffd84f"/><text x="22" y="-7" font-size="22" font-weight="800">03</text><text x="22" y="20" font-size="18" font-weight="800" letter-spacing="3">BUILD</text></g>
    <g transform="translate(1270 320)"><circle cx="0" cy="0" r="10" fill="#ffd84f"/><text x="22" y="-7" font-size="22" font-weight="800">04</text><text x="22" y="20" font-size="18" font-weight="800" letter-spacing="3">HAND OFF</text></g>
  </g>

  <g filter="url(#paperShadow)">
    <g transform="translate(116 312) rotate(-5 150 175)">
      <rect x="12" y="14" width="300" height="350" rx="12" fill="#ede8da"/>
      <rect width="300" height="350" rx="12" fill="#faf7ed"/>
      <path d="M0 55h300" stroke="#ded8c9" stroke-width="2"/>
      <rect x="115" y="-18" width="70" height="36" rx="5" fill="#10253f"/>
      <text x="28" y="38" fill="#10253f" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="800">FOUNDER CONVERSATION</text>
      <text x="28" y="96" fill="#10253f" font-family="EB Garamond,Georgia,serif" font-size="22" font-style="italic">Problem</text>
      <path d="M28 114h226M28 140h184" stroke="#bdb7aa" stroke-width="8" stroke-linecap="round"/>
      <text x="28" y="194" fill="#10253f" font-family="EB Garamond,Georgia,serif" font-size="22" font-style="italic">Who depends on it</text>
      <path d="M28 212h210M28 238h154" stroke="#bdb7aa" stroke-width="8" stroke-linecap="round"/>
      <rect x="28" y="278" width="244" height="44" rx="8" fill="#fff0a8"/>
      <text x="48" y="307" fill="#10253f" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="800">CONTEXT CAPTURED</text>
    </g>

    <g transform="translate(472 364) rotate(3 150 150)">
      <rect x="10" y="12" width="300" height="304" rx="12" fill="#e8e1d1"/>
      <rect width="300" height="304" rx="12" fill="#faf7ed"/>
      <path d="M0 58h300" stroke="#ded8c9" stroke-width="2"/>
      <text x="28" y="39" fill="#10253f" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="800">DECISION RECORD</text>
      <text x="28" y="101" fill="#10253f" font-family="EB Garamond,Georgia,serif" font-size="22" font-style="italic">Approach</text>
      <path d="M28 120h221M28 148h180" stroke="#bdb7aa" stroke-width="8" stroke-linecap="round"/>
      <text x="28" y="200" fill="#10253f" font-family="EB Garamond,Georgia,serif" font-size="22" font-style="italic">Tradeoffs</text>
      <path d="M28 219h232M28 247h164" stroke="#bdb7aa" stroke-width="8" stroke-linecap="round"/>
      <path d="m250 38 20 20 38-44" fill="none" stroke="#ffd84f" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="translate(836 140) rotate(-2 190 210)">
      <rect x="12" y="14" width="380" height="420" rx="12" fill="#e6dfcf"/>
      <rect width="380" height="420" rx="12" fill="#faf7ed"/>
      <rect width="380" height="420" rx="12" fill="url(#grid)" opacity=".8"/>
      <rect x="252" y="-14" width="94" height="34" rx="4" fill="#10253f"/>
      <text x="28" y="49" fill="#10253f" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800">FOCUSED BUILD</text>
      <g fill="#faf7ed" stroke="#10253f" stroke-width="3" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle">
        <rect x="52" y="86" width="130" height="50" rx="6"/><text x="117" y="117" fill="#10253f" stroke="none">INTAKE</text>
        <rect x="52" y="174" width="130" height="50" rx="6"/><text x="117" y="205" fill="#10253f" stroke="none">VALIDATE</text>
        <rect x="52" y="262" width="130" height="50" rx="6"/><text x="117" y="293" fill="#10253f" stroke="none">DELIVER</text>
        <path d="M117 136v38M117 224v38" fill="none"/>
        <path d="m110 165 7 9 7-9M110 253l7 9 7-9" fill="none"/>
        <ellipse cx="285" cy="184" rx="48" ry="17"/><path d="M237 184v88c0 10 22 18 48 18s48-8 48-18v-88" fill="#faf7ed"/><text x="285" y="240" fill="#10253f" stroke="none">DATA</text>
        <path d="M182 111h103v56M182 199h55M182 287h103v-2" fill="none" stroke-dasharray="7 7"/>
      </g>
      <circle cx="58" cy="365" r="12" fill="#ffd84f"/><text x="83" y="372" fill="#10253f" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">SYSTEM READY</text>
    </g>

    <g transform="translate(1272 366) rotate(3 145 150)">
      <rect x="10" y="12" width="290" height="304" rx="12" fill="#e7dfcf"/>
      <rect width="290" height="304" rx="12" fill="#faf7ed"/>
      <path d="M0 58h290" stroke="#ded8c9" stroke-width="2"/>
      <text x="28" y="39" fill="#10253f" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="800">HANDOFF</text>
      <g fill="#10253f" font-family="Inter,Arial,sans-serif" font-size="17">
        <text x="64" y="103">Documentation</text><text x="64" y="146">System access</text><text x="64" y="189">Runbook</text><text x="64" y="232">Next priorities</text>
      </g>
      <g fill="none" stroke="#10253f" stroke-width="3"><rect x="28" y="84" width="22" height="22" rx="3"/><rect x="28" y="127" width="22" height="22" rx="3"/><rect x="28" y="170" width="22" height="22" rx="3"/><rect x="28" y="213" width="22" height="22" rx="3"/></g>
      <g fill="none" stroke="#ffd84f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="m32 94 7 7 15-18"/><path d="m32 137 7 7 15-18"/><path d="m32 180 7 7 15-18"/><path d="m32 223 7 7 15-18"/></g>
      <circle cx="244" cy="264" r="28" fill="#10253f"/><text x="244" y="272" text-anchor="middle" fill="#ffd84f" font-family="EB Garamond,Georgia,serif" font-size="24" font-weight="700">HC</text>
    </g>
  </g>
</svg>
