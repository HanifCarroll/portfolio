<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1531" viewBox="0 0 720 1531">
  <rect width="720" height="1531" fill="#f3eee7"/>

  <text x="48" y="52" fill="#a85f3f" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="3">SYSTEM OWNERSHIP</text>
  <text x="48" y="96" fill="#2b172d" font-family="Georgia, serif" font-size="31">Each tool has one clear responsibility</text>
  <text x="48" y="128" fill="#625a56" font-family="Helvetica Neue, Arial, sans-serif" font-size="15">The guest conversation stays simple because the business rules live elsewhere.</text>

  <rect x="32" y="170" width="656" height="326" rx="26" fill="#fffdf9" stroke="#d8cec5" stroke-width="2"/>
  <text x="72" y="224" fill="#9b7705" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3">GUEST EXPERIENCE</text>
  <text x="72" y="282" fill="#2b172d" font-family="Georgia, serif" font-size="38">Typebot</text>
  <text x="72" y="330" fill="#625a56" font-family="Helvetica Neue, Arial, sans-serif" font-size="21">Asks for the guest's goal and available time,</text>
  <text x="72" y="362" fill="#625a56" font-family="Helvetica Neue, Arial, sans-serif" font-size="21">then presents one approved service.</text>
  <line x1="72" y1="405" x2="648" y2="405" stroke="#ddd3cb" stroke-width="2"/>
  <text x="72" y="448" fill="#a85f3f" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700">IT DOESN'T DECIDE WHICH SERVICES QUALIFY</text>

  <path d="M360 512v42" stroke="#a85f3f" stroke-width="3"/>
  <path d="m349 544 11 15 11-15" fill="none" stroke="#a85f3f" stroke-width="3"/>

  <rect x="32" y="575" width="656" height="326" rx="26" fill="#2b172d"/>
  <text x="72" y="629" fill="#d7a07e" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3">OPERATING LOGIC</text>
  <text x="72" y="687" fill="#fffdf9" font-family="Georgia, serif" font-size="38">Make</text>
  <text x="72" y="735" fill="#ded5dc" font-family="Helvetica Neue, Arial, sans-serif" font-size="21">Applies the catalog rules before DeepSeek</text>
  <text x="72" y="767" fill="#ded5dc" font-family="Helvetica Neue, Arial, sans-serif" font-size="21">ranks the eligible options.</text>
  <line x1="72" y1="810" x2="648" y2="810" stroke="#5b4459" stroke-width="2"/>
  <text x="72" y="853" fill="#d7a07e" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700">ONE WORKFLOW HANDLES EACH LATER EVENT</text>

  <path d="M360 917v42" stroke="#a85f3f" stroke-width="3"/>
  <path d="m349 949 11 15 11-15" fill="none" stroke="#a85f3f" stroke-width="3"/>

  <rect x="32" y="980" width="656" height="326" rx="26" fill="#fffdf9" stroke="#d8cec5" stroke-width="2"/>
  <text x="72" y="1034" fill="#9b7705" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3">BUSINESS RECORDS</text>
  <line x1="360" y1="1062" x2="360" y2="1244" stroke="#ddd3cb" stroke-width="2"/>
  <line x1="72" y1="1153" x2="648" y2="1153" stroke="#ddd3cb" stroke-width="2"/>

  <text x="72" y="1108" fill="#2b172d" font-family="Georgia, serif" font-size="29">Airtable</text>
  <text x="72" y="1136" fill="#625a56" font-family="Helvetica Neue, Arial, sans-serif" font-size="16">Catalog and visits</text>
  <text x="392" y="1108" fill="#2b172d" font-family="Georgia, serif" font-size="29">Cal.com</text>
  <text x="392" y="1136" fill="#625a56" font-family="Helvetica Neue, Arial, sans-serif" font-size="16">Availability</text>

  <text x="72" y="1203" fill="#2b172d" font-family="Georgia, serif" font-size="29">Tally</text>
  <text x="72" y="1231" fill="#625a56" font-family="Helvetica Neue, Arial, sans-serif" font-size="16">Guest forms</text>
  <text x="392" y="1203" fill="#2b172d" font-family="Georgia, serif" font-size="29">Email</text>
  <text x="392" y="1231" fill="#625a56" font-family="Helvetica Neue, Arial, sans-serif" font-size="16">Messages</text>

  <text x="48" y="1390" fill="#2b172d" font-family="Georgia, serif" font-size="25">Staff can update services in Airtable</text>
  <text x="48" y="1425" fill="#2b172d" font-family="Georgia, serif" font-size="25">without rebuilding the concierge.</text>
</svg>
