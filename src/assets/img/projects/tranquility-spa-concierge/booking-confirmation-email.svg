<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1125" viewBox="0 0 1800 1125">
  <rect width="1800" height="1125" fill="#f3eee7"/>
  <text x="120" y="120" fill="#a85f3f" font-family="Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="4">BOOKING CONFIRMATION</text>
  <text x="120" y="205" fill="#2b172d" font-family="Georgia, serif" font-size="58">The booking immediately becomes a prepared visit</text>
  <text x="120" y="255" fill="#625a56" font-family="Helvetica Neue, Arial, sans-serif" font-size="25">The guest receives a readable confirmation and one clear intake action.</text>

  <rect x="300" y="330" width="1200" height="675" rx="28" fill="#fffdf9" stroke="#d8cec5" stroke-width="2"/>
  <text x="380" y="410" fill="#2b172d" font-family="Georgia, serif" font-size="34">Tranquility.</text>
  <text x="1420" y="410" fill="#8b817b" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="17">Appointment confirmed</text>
  <line x1="380" y1="450" x2="1420" y2="450" stroke="#e0d7cf" stroke-width="2"/>

  <text x="380" y="520" fill="#2b172d" font-family="Georgia, serif" font-size="44">Your visit is booked.</text>
  <text x="380" y="570" fill="#625a56" font-family="Helvetica Neue, Arial, sans-serif" font-size="21">We’re looking forward to welcoming you, Jordan.</text>

  <rect x="380" y="620" width="1040" height="170" rx="18" fill="#f3eee7"/>
  <text x="425" y="665" fill="#a85f3f" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">YOUR APPOINTMENT</text>
  <text x="425" y="715" fill="#2b172d" font-family="Georgia, serif" font-size="31">Thursday, August 27 at 8:00 AM</text>
  <text x="425" y="758" fill="#625a56" font-family="Helvetica Neue, Arial, sans-serif" font-size="21">Tranquility Massage · 60 minutes</text>
  <text x="1370" y="715" fill="#625a56" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="18">Booking reference</text>
  <text x="1370" y="750" fill="#2b172d" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700">TRQ-827-1042</text>

  <text x="380" y="850" fill="#2b172d" font-family="Helvetica Neue, Arial, sans-serif" font-size="21">Please share the information that will help our team prepare for your visit.</text>
  <rect x="380" y="885" width="350" height="64" rx="12" fill="#2b172d"/>
  <text x="555" y="926" fill="#fffdf9" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700">Complete pre-visit intake</text>
  <text x="120" y="1070" fill="#2b172d" font-family="Georgia, serif" font-size="32">Date, time, service, and reference stay readable without exposing system fields.</text>
</svg>
