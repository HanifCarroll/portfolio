<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1125" viewBox="0 0 1800 1125">
  <rect width="1800" height="1125" fill="#f3eee7"/>
  <text x="120" y="120" fill="#a85f3f" font-family="Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="4">GUEST CONVERSATION</text>
  <text x="120" y="205" fill="#2b172d" font-family="Georgia, serif" font-size="58">From an uncertain request to one clear next step</text>
  <text x="120" y="255" fill="#625a56" font-family="Helvetica Neue, Arial, sans-serif" font-size="25">The concierge gathers only the context needed to recommend an approved service.</text>

  <rect x="120" y="340" width="1560" height="620" rx="28" fill="#fffdf9" stroke="#d8cec5" stroke-width="2"/>
  <rect x="120" y="340" width="1560" height="86" rx="28" fill="#2b172d"/>
  <rect x="120" y="398" width="1560" height="28" fill="#2b172d"/>
  <text x="175" y="395" fill="#fffdf9" font-family="Georgia, serif" font-size="31">Tranquility Concierge</text>
  <circle cx="1620" cy="382" r="8" fill="#d7a07e"/>

  <rect x="175" y="475" width="560" height="104" rx="24" fill="#f3eee7"/>
  <text x="210" y="518" fill="#2b172d" font-family="Helvetica Neue, Arial, sans-serif" font-size="22">What would you like help with today?</text>
  <text x="210" y="551" fill="#625a56" font-family="Helvetica Neue, Arial, sans-serif" font-size="18">Tell me the result you want and where you feel it.</text>

  <rect x="875" y="475" width="710" height="88" rx="24" fill="#b86b43"/>
  <text x="920" y="529" fill="#fffdf9" font-family="Helvetica Neue, Arial, sans-serif" font-size="22">My shoulders feel tight and I have about an hour.</text>

  <rect x="175" y="620" width="820" height="215" rx="24" fill="#f3eee7"/>
  <text x="210" y="670" fill="#a85f3f" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2">ONE APPROVED RECOMMENDATION</text>
  <text x="210" y="728" fill="#2b172d" font-family="Georgia, serif" font-size="36">Tranquility Massage · 60 minutes</text>
  <text x="210" y="776" fill="#625a56" font-family="Helvetica Neue, Arial, sans-serif" font-size="21">A strong fit for focused muscle-tension relief within your available time.</text>
  <text x="210" y="812" fill="#625a56" font-family="Helvetica Neue, Arial, sans-serif" font-size="18">Service guidance only · no medical advice</text>

  <rect x="1045" y="620" width="540" height="215" rx="24" fill="#fffdf9" stroke="#d8cec5" stroke-width="2"/>
  <text x="1090" y="670" fill="#9b7705" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2">NEXT STEP</text>
  <rect x="1090" y="700" width="450" height="58" rx="12" fill="#2b172d"/>
  <text x="1315" y="738" fill="#fffdf9" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700">Continue to booking</text>
  <text x="1090" y="805" fill="#2b172d" font-family="Helvetica Neue, Arial, sans-serif" font-size="19">Change my answers</text>
  <text x="1325" y="805" fill="#2b172d" font-family="Helvetica Neue, Arial, sans-serif" font-size="19">Ask the spa</text>

  <text x="120" y="1040" fill="#2b172d" font-family="Georgia, serif" font-size="34">Contact details appear only after the guest chooses booking or staff help.</text>
</svg>
