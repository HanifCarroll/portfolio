<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1125" viewBox="0 0 1800 1125">
  <rect width="1800" height="1125" fill="#f3eee7"/>
  <text x="120" y="120" fill="#a85f3f" font-family="Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="4">POST-VISIT FOLLOW-UP</text>
  <text x="120" y="205" fill="#2b172d" font-family="Georgia, serif" font-size="58">Aftercare reaches the guest and feedback returns to staff</text>
  <text x="120" y="255" fill="#625a56" font-family="Helvetica Neue, Arial, sans-serif" font-size="25">Completing the visit triggers one helpful message and one short response path.</text>

  <rect x="120" y="345" width="815" height="620" rx="28" fill="#fffdf9" stroke="#d8cec5" stroke-width="2"/>
  <text x="175" y="410" fill="#2b172d" font-family="Georgia, serif" font-size="31">Tranquility.</text>
  <text x="880" y="410" fill="#8b817b" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="16">After your visit</text>
  <line x1="175" y1="450" x2="880" y2="450" stroke="#e0d7cf" stroke-width="2"/>
  <text x="175" y="520" fill="#2b172d" font-family="Georgia, serif" font-size="39">A considered close to your visit.</text>
  <text x="175" y="572" fill="#625a56" font-family="Helvetica Neue, Arial, sans-serif" font-size="20">Thank you for visiting us today, Jordan.</text>
  <rect x="175" y="620" width="705" height="165" rx="18" fill="#f3eee7"/>
  <text x="210" y="663" fill="#a85f3f" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">YOUR AFTERCARE</text>
  <text x="210" y="710" fill="#2b172d" font-family="Helvetica Neue, Arial, sans-serif" font-size="20">Hydrate well and allow your shoulders time to settle.</text>
  <text x="210" y="748" fill="#625a56" font-family="Helvetica Neue, Arial, sans-serif" font-size="18">These notes were recorded by the team after your visit.</text>
  <rect x="175" y="830" width="250" height="62" rx="12" fill="#2b172d"/>
  <text x="300" y="870" fill="#fffdf9" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700">Share feedback</text>

  <rect x="985" y="345" width="695" height="620" rx="28" fill="#fffdf9" stroke="#d8cec5" stroke-width="2"/>
  <text x="1040" y="410" fill="#9b7705" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2">TALLY FEEDBACK</text>
  <text x="1040" y="475" fill="#2b172d" font-family="Georgia, serif" font-size="39">How was your visit?</text>
  <text x="1040" y="520" fill="#625a56" font-family="Helvetica Neue, Arial, sans-serif" font-size="19">Your response helps the spa improve the experience.</text>
  <text x="1040" y="585" fill="#2b172d" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700">Overall experience</text>
  <g font-family="Helvetica Neue, Arial, sans-serif" font-size="23" text-anchor="middle">
    <circle cx="1090" cy="645" r="30" fill="#f3eee7"/><text x="1090" y="653" fill="#2b172d">1</text>
    <circle cx="1175" cy="645" r="30" fill="#f3eee7"/><text x="1175" y="653" fill="#2b172d">2</text>
    <circle cx="1260" cy="645" r="30" fill="#d7a07e"/><text x="1260" y="653" fill="#2b172d">3</text>
    <circle cx="1345" cy="645" r="30" fill="#f3eee7"/><text x="1345" y="653" fill="#2b172d">4</text>
    <circle cx="1430" cy="645" r="30" fill="#f3eee7"/><text x="1430" y="653" fill="#2b172d">5</text>
  </g>
  <text x="1040" y="730" fill="#2b172d" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700">Anything you’d like us to know?</text>
  <rect x="1040" y="755" width="585" height="82" rx="14" fill="#f3eee7"/>
  <text x="1070" y="802" fill="#8b817b" font-family="Helvetica Neue, Arial, sans-serif" font-size="18">The room was lovely. Please contact me about...</text>
  <rect x="1040" y="870" width="240" height="58" rx="12" fill="#2b172d"/>
  <text x="1160" y="907" fill="#fffdf9" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="700">Submit feedback</text>
  <rect x="1325" y="850" width="300" height="78" rx="14" fill="#fae6dc"/>
  <text x="1350" y="882" fill="#8f432d" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1">OWNER ALERT SENT</text>
  <text x="1350" y="910" fill="#8f432d" font-family="Helvetica Neue, Arial, sans-serif" font-size="16">3/5 · contact requested</text>

  <text x="120" y="1050" fill="#2b172d" font-family="Georgia, serif" font-size="32">Every score can be reviewed; responses requesting help are surfaced to staff.</text>
</svg>
