  <text x="175" y="455" fill="#d7a07e" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">THURSDAY · AUGUST 27</text>

  <rect x="155" y="500" width="270" height="112" rx="16" fill="#4a3149"/>
  <text x="180" y="536" fill="#d8cfd6" font-family="Helvetica Neue, Arial, sans-serif" font-size="16">8:00 AM</text>
  <text x="180" y="570" fill="#fffdf9" font-family="Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="700">Jordan Lee</text>
  <text x="180" y="597" fill="#d8cfd6" font-family="Helvetica Neue, Arial, sans-serif" font-size="16">Tranquility Massage</text>
  <text x="175" y="665" fill="#d8cfd6" font-family="Helvetica Neue, Arial, sans-serif" font-size="18">9:30 AM · Maya L.</text>
