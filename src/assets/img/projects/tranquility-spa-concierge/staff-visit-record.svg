  <text x="815" y="875" fill="#625a56" font-family="Helvetica Neue, Arial, sans-serif" font-size="18">Sends approved aftercare and the feedback link.</text>

  <text x="120" y="1060" fill="#2b172d" font-family="Georgia, serif" font-size="32">The queue answers what is next; the record holds what staff need to act.</text>
