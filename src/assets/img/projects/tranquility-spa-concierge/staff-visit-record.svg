  <text x="120" y="205" fill="#2b172d" font-family="Georgia, serif" font-size="58">One record carries the visit from intake to follow-up</text>
  <text x="120" y="255" fill="#625a56" font-family="Helvetica Neue, Arial, sans-serif" font-size="25">Staff can review preparation details, record the outcome, and complete the visit.</text>

  <rect x="120" y="330" width="1560" height="650" rx="28" fill="#fffdf9" stroke="#d8cec5" stroke-width="2"/>
