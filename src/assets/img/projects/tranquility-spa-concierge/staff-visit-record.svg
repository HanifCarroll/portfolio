  <text x="525" y="550" fill="#2b172d" font-family="Helvetica Neue, Arial, sans-serif" font-size="21">Thursday, August 27 · 8:00–9:00 AM</text>
  <text x="525" y="590" fill="#625a56" font-family="Helvetica Neue, Arial, sans-serif" font-size="19">Goal: relieve muscle tension · Preference: quiet, firm pressure</text>

