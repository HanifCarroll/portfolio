  <text x="555" y="755" fill="#625a56" font-family="Helvetica Neue, Arial, sans-serif" font-size="18">Guest note: desk-related tightness</text>

  <text x="1090" y="655" fill="#9b7705" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">STAFF COMPLETION</text>
