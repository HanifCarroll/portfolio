<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1125" viewBox="0 0 1800 1125">
  <rect width="1800" height="1125" fill="#f3eee7"/>
  <text x="120" y="120" fill="#a85f3f" font-family="Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="4">SYSTEM OWNERSHIP</text>
  <text x="120" y="205" fill="#2b172d" font-family="Georgia, serif" font-size="58">Each tool has one clear responsibility</text>
  <text x="120" y="255" fill="#625a56" font-family="Helvetica Neue, Arial, sans-serif" font-size="25">Each layer has one job, so the business can change services without rebuilding the guest flow.</text>

  <rect x="120" y="350" width="430" height="510" rx="24" fill="#fffdf9" stroke="#d8cec5" stroke-width="2"/>
  <text x="165" y="420" fill="#9b7705" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">GUEST EXPERIENCE</text>
  <text x="165" y="485" fill="#2b172d" font-family="Georgia, serif" font-size="39">Typebot</text>
  <text x="165" y="535" fill="#625a56" font-family="Helvetica Neue, Arial, sans-serif" font-size="23">Asks four useful questions</text>
  <text x="165" y="575" fill="#625a56" font-family="Helvetica Neue, Arial, sans-serif" font-size="23">Shows one recommendation</text>
  <text x="165" y="615" fill="#625a56" font-family="Helvetica Neue, Arial, sans-serif" font-size="23">Offers booking or staff help</text>
  <line x1="165" y1="680" x2="505" y2="680" stroke="#ddd3cb" stroke-width="2"/>
  <text x="165" y="730" fill="#a85f3f" font-family="Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="700">DOES NOT OWN</text>
  <text x="165" y="770" fill="#625a56" font-family="Helvetica Neue, Arial, sans-serif" font-size="21">Catalog rules, availability,</text>
  <text x="165" y="805" fill="#625a56" font-family="Helvetica Neue, Arial, sans-serif" font-size="21">booking records, or follow-up.</text>

  <path d="M575 605h90" stroke="#a85f3f" stroke-width="3"/>
  <path d="m655 594 15 11-15 11" fill="none" stroke="#a85f3f" stroke-width="3"/>

  <rect x="690" y="350" width="420" height="510" rx="24" fill="#2b172d"/>
  <text x="735" y="420" fill="#d7a07e" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">OPERATING LOGIC</text>
  <text x="735" y="485" fill="#fffdf9" font-family="Georgia, serif" font-size="39">Make</text>
  <text x="735" y="535" fill="#ded5dc" font-family="Helvetica Neue, Arial, sans-serif" font-size="23">Filters eligible services</text>
  <text x="735" y="575" fill="#ded5dc" font-family="Helvetica Neue, Arial, sans-serif" font-size="23">Shapes the AI request</text>
  <text x="735" y="615" fill="#ded5dc" font-family="Helvetica Neue, Arial, sans-serif" font-size="23">Routes each business event</text>
  <line x1="735" y1="680" x2="1065" y2="680" stroke="#5b4459" stroke-width="2"/>
  <text x="735" y="730" fill="#d7a07e" font-family="Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="700">ONE WORKFLOW PER EVENT</text>
  <text x="735" y="770" fill="#ded5dc" font-family="Helvetica Neue, Arial, sans-serif" font-size="21">Recommendation · Booking · Intake</text>
  <text x="735" y="805" fill="#ded5dc" font-family="Helvetica Neue, Arial, sans-serif" font-size="21">Visit completion · Feedback</text>

  <path d="M1135 605h90" stroke="#a85f3f" stroke-width="3"/>
  <path d="m1215 594 15 11-15 11" fill="none" stroke="#a85f3f" stroke-width="3"/>

  <rect x="1250" y="350" width="430" height="510" rx="24" fill="#fffdf9" stroke="#d8cec5" stroke-width="2"/>
  <text x="1295" y="420" fill="#9b7705" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">BUSINESS RECORDS</text>
  <text x="1295" y="480" fill="#2b172d" font-family="Georgia, serif" font-size="34">Airtable</text>
  <text x="1635" y="480" fill="#625a56" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="21">Catalog + visits</text>
  <line x1="1295" y1="515" x2="1635" y2="515" stroke="#ddd3cb" stroke-width="2"/>
  <text x="1295" y="575" fill="#2b172d" font-family="Georgia, serif" font-size="34">Cal.com</text>
  <text x="1635" y="575" fill="#625a56" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="21">Availability</text>
  <line x1="1295" y1="610" x2="1635" y2="610" stroke="#ddd3cb" stroke-width="2"/>
  <text x="1295" y="670" fill="#2b172d" font-family="Georgia, serif" font-size="34">Tally</text>
  <text x="1635" y="670" fill="#625a56" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="21">Intake + feedback</text>
  <line x1="1295" y1="705" x2="1635" y2="705" stroke="#ddd3cb" stroke-width="2"/>
  <text x="1295" y="765" fill="#2b172d" font-family="Georgia, serif" font-size="34">Email</text>
  <text x="1635" y="765" fill="#625a56" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="21">Guest + staff messages</text>
  <text x="1295" y="820" fill="#a85f3f" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700">FAMILIAR TOOLS STAY AUTHORITATIVE</text>

  <text x="120" y="990" fill="#2b172d" font-family="Georgia, serif" font-size="34">Thin presentation layer. Visible business rules. Replaceable components.</text>
</svg>
