<style>
  #captions-root {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .caption-layer {
    position: absolute;
    inset: 0;
    z-index: 20;
    pointer-events: none;
  }
  /* the keep-out band, from captionBand(H) — frame content stays above it */
  .caption-stage {
    position: absolute;
    left: 0;
    right: 0;
    top: var(--cap-band-top, 900px);
    height: var(--cap-band-height, 180px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .caption-group {
    /* every group is absolutely stacked over the SAME band — exactly one shown at a
       time via opacity. Must be absolute: in-flow groups would lay out side-by-side. */
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
  }

  /* THE white flat card — frame.md surface: #FFFFFF fill, 1.5px #E3E6EB border,
     6px radius, NO shadow (flat is the premium signal). Square two-line pill. */
  .caption-pill {
    position: relative;
    max-width: 92%;
    padding: 18px 40px 20px;
    background: var(--card-bg, #FFFFFF);
    border: 1.5px solid var(--border, #E3E6EB);
    border-radius: 6px;
  }
  .caption-line {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.12em 0.34em;
    font-family: "Inter", system-ui, sans-serif;
    font-weight: 500;
    font-size: clamp(34px, 4.2cqw, 46px);
    line-height: 1.18;
    letter-spacing: -0.01em;
    text-align: center;
    color: var(--cap-ink, #1E2430);
  }

  /* upcoming — muted secondary (#576071), no block */
  .caption-word {
    display: inline-block;
    padding: 0 0.04em;
    color: var(--cap-accent-2, #576071);
    transition: none;
  }
  /* current word — THE cobalt commit (#2F5BD9): a flat solid block via box-shadow
     spread (no blur, no layout shift), ink-white reads on top; the one accent */
  .caption-word.is-active {
    color: var(--cap-canvas, #F6F7F9);
    background: var(--cap-accent, #2F5BD9);
    box-shadow: 0 0 0 0.05em var(--cap-accent, #2F5BD9);
  }
  /* already spoken — solid ink (#1E2430), block cleared */
  .caption-word.is-spoken {
    color: var(--cap-ink, #1E2430);
    background: transparent;
    box-shadow: none;
  }

  /* optional per-word accents (dormant until a word-classer tags them) */
  /* numerals / data — the body Inter voice, slightly recessed */
  .caption-word.cap-num {
    font-family: "Inter", system-ui, sans-serif;
    font-weight: 600;
    color: var(--cap-accent, #2F5BD9);
  }
  /* emphasis — a cobalt underline (no second hue; emphasis is the accent) */
  .caption-word.cap-cta {
    text-decoration: underline;
    text-decoration-thickness: 2px;
    text-decoration-color: var(--cap-accent, #2F5BD9);
    text-underline-offset: 0.1em;
  }

  @media (max-aspect-ratio: 9/16) {
    .caption-pill {
      max-width: 96%;
      padding: 16px 28px 18px;
    }
    .caption-line {
      font-size: clamp(30px, 5.2cqw, 42px);
    }
  }
