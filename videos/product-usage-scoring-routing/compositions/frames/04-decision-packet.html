<script>
  (function () {
    var gsap = window.gsap;
    var root = document.getElementById("04-decision-packet");
    if (!gsap || !root) return;

    var $ = function (sel) { return root.querySelector(sel); };

    var cursor = $(".dsp-cursor");
    var row = $(".dsp-row");
    var card = $(".dsp-card");
    var ripples = [].slice.call(root.querySelectorAll(".dsp-ripple"));
    var gateFit = $(".dsp-gate-fit");
    var gateUsage = $(".dsp-gate-usage");
    var gateIntent = $(".dsp-gate-intent");
    var intentEmph = $(".dsp-gate-value-emph");
    var routeCard = $(".dsp-route-card");
    var routeRows = [].slice.call(root.querySelectorAll(".dsp-route-card .dsp-route-row, .dsp-route-reason"));
    var rejectCard = $(".dsp-reject-card");

    // Account-row centroid in px on 1080 canvas (1cqw = 1cqh = 10.8px)
    var ROW_X = 497, ROW_Y = 481;
    var tl = gsap.timeline({ paused: true });

    // ===== Scene 1 (0.0–1.4s) — queue-to-packet seam: row arrives, cursor clicks, packet opens.
    // Row is present from Frame 3's handoff (x 46, y 46, scale 1, opacity 1, cobalt-soft fill).
    tl.set(card, { opacity: 0, scale: 0.96 }, 0);
    tl.set(gateFit, { opacity: 0, y: 12 }, 0);
    tl.set(gateUsage, { opacity: 0, y: 12 }, 0);
    tl.set(gateIntent, { opacity: 0, y: 12 }, 0);
    tl.set(routeCard, { opacity: 0, y: 14 }, 0);
    tl.set(routeRows, { opacity: 0, y: 10 }, 0);
    tl.set(rejectCard, { opacity: 0, y: 14 }, 0);

    // Cursor entry + dart to the row (~"Why this route?")
    tl.set(cursor, { x: 886, y: 216 }, 0);
    tl.to(cursor, { x: ROW_X, y: ROW_Y, duration: 0.55, ease: "power3.out" }, 0.16);

    // Click — cursor + row depress together, then return (cursor-click-ripple press,
    // deterministic chained press/release — no yoyo loop)
    tl.to(cursor, { scale: 0.85, duration: 0.09, ease: "power2.in" }, 0.72);
    tl.to(row,    { scale: 0.92, duration: 0.09, ease: "power2.in" }, 0.72);
    tl.to(cursor, { scale: 1, duration: 0.09, ease: "power2.out" }, 0.81);
    tl.to(row,    { scale: 1, duration: 0.09, ease: "power2.out" }, 0.81);

    // Ripple burst — 3 rings staggered from the row center
    tl.set(ripples, { scale: 0 }, 0.0);
    tl.set(ripples, { opacity: 1 }, 0.78);
    tl.to(ripples, {
      scale: 4.5, opacity: 0, duration: 0.7, ease: "power2.out",
      stagger: 0.08, immediateRender: false
    }, 0.78);

    // Row depresses into the opening packet — the cut-stitch seam.
    // Card establishes by ~0.5s (hero-visible) and opens to its handoff scale 0.70.
    tl.to(card,  { opacity: 1, scale: 0.70, duration: 0.6, ease: "power3.out" }, 0.35);
    tl.to(row,   { scale: 0.72, opacity: 0, duration: 0.4, ease: "power2.in" }, 0.86);

    // Cursor retreats to the inspector to "read" the gates
    tl.to(cursor, { x: 886, y: 216, duration: 0.5, ease: "power2.inOut" }, 1.6);

    // ===== Scene 2 (1.4–3.5s) — three gates reveal on the VO; Buying intent pops as decisive evidence.
    tl.to(gateFit,   { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 1.65); // …explicit…
    tl.to(gateUsage, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 2.25); // …a hand…
    tl.to(gateIntent,{ opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 2.9);  // …raiser.

    // asr-keyword-glow — linear driver scales + glows the decisive Buying-intent High cell
    // exactly as "intent explicit — a hand raiser" is spoken (~1.55–3.2s).
    var driver = { t: 0 };
    var WINDOW = 1.65, ATTACK = 0.18, RELEASE = 0.35, REST = 0.15, BLUR = 26, BOOST = 0.16;
    tl.to(driver, {
      t: WINDOW,
      duration: WINDOW,
      ease: "none",
      onUpdate: function () {
        var time = driver.t, env;
        if (time <= 0) env = 0;
        else if (time < WINDOW) env = Math.min(time / ATTACK, 1);            // linear attack
        else if (time < WINDOW + RELEASE) env = 1 - ((time - WINDOW) / RELEASE) * (1 - REST); // decay
        else env = REST;                                                     // breadcrumb rest
        env = Math.max(0, Math.min(1, env));
        intentEmph.style.textShadow = "0 0 " + (BLUR * env) + "px rgba(47,91,217," + (0.85 * env) + ")";
        intentEmph.style.transform = "scale(" + (1 + BOOST * env) + ")";
      }
    }, 1.55);

    // Cursor hovers the decisive cell
    tl.to(cursor, { x: 886, y: 432, duration: 0.5, ease: "power2.inOut" }, 3.0);

    tl.to(routeCard, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 3.7);

    tl.to(rejectCard, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 4.6);
